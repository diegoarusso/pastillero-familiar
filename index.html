        // --- MODO DEMO: cliente falso con la misma API que usa la app ---
        function makeDemoDb() {
            const T = demoSeed();
            let nextId = 900000;
            return {
                from(table) {
                    const rows = T[table] || (T[table] = []);
                    return {
                        _result: null, _update: null, _delete: false,
                        insert(obj) {
                            const arr = Array.isArray(obj) ? obj : [obj];
                            const created = arr.map(o => ({ ...o, id: nextId++, created_at: new Date().toISOString() }));
                            created.forEach(c => rows.push(c));
                            this._result = created; return this;
                        },
                        update(obj) { this._update = obj; return this; },
                        delete() { this._delete = true; return this; },
                        eq(col, val) {
                            if (this._update) {
                                const hit = rows.filter(r => r[col] === val);
                                hit.forEach(r => Object.assign(r, this._update));
                                this._result = hit;
                            } else if (this._delete) {
                                for (let i = rows.length - 1; i >= 0; i--) if (rows[i][col] === val) rows.splice(i, 1);
                                this._result = [];
                            }
                            return this;
                        },
                        select() { return Promise.resolve({ data: this._result || rows.slice(), error: null }); },
                        then(res, rej) { return Promise.resolve({ data: this._result || rows.slice(), error: null }).then(res, rej); }
                    };
                }
            };
        }

        // Datos de demostración: familia ficticia, generados relativos a "ahora"

            const logs = [];

            // Historial de adherencia: 20 días completos hacia atrás (hoy queda parcial a propósito)

            // Episodio febril en curso del nene (perfil 3): curva realista + antipiréticos
            const curva = [
                [38, 38.2], [37.5, 'Ibuprofeno'], [35, 37.4], [32, 37.1], [30, 38.6], [29.5, 'Ibuprofeno'],
                [27, 37.6], [24, 38.9], [23.5, 'Novalgina'], [21, 37.8], [18, 39.4], [17.5, 'Ibuprofeno'],
                [15, 38.0], [12, 37.5], [9, 38.4], [8.5, 'Ibuprofeno'], [6, 37.6], [3, 37.9],
                [2, 'Ibuprofeno'], [1.2, 37.4], [0.5, 37.1]
            ];
            const temps = []; let tid = 2000;
            curva.forEach(([h, v]) => {
                const p = at(h);
                if (typeof v === 'number') temps.push({ id: tid++, profile_id: 3, date: p.date, time: p.time, temp: v, note: null, med_log_id: null, created_at: iso(h) });
                else logs.push({ id: lid++, med_id: null, profile_id: 3, date: p.date, time: p.time, taken_at: p.time, name: v, dose: v === 'Novalgina' ? '4ml' : '5ml', created_at: iso(h) });

            return {
                medications: meds, logs, temperatures: temps,

        // --- HELPERS DE FECHA (SOLUCIÓN AL BUG DE ZONA HORARIA) ---
        // Fecha local YYYY-MM-DD de un Date cualquiera
        function toLocalDateStr(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getLocalToday() {
            return toLocalDateStr(new Date());
        }

        // Desde cuándo "existe" un medicamento (no cuenta como incumplido antes de darlo de alta)
        function medStartDateStr(med) {
            if (!med) return null;
            const dates = [];
            if (med.created_at) { const d = new Date(med.created_at); if (!isNaN(d.getTime())) dates.push(toLocalDateStr(d)); }
            if (med.start_date) dates.push(med.start_date);
            if (!dates.length) return null;
            return dates.sort()[dates.length - 1]; // la más tardía
        }

        function getLocalTime() {
            return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
        }

        // Suma/resta días a un string YYYY-MM-DD sin problemas de zona horaria
        function shiftDateStr(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + days);
            const yy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        // Etiqueta amigable: Hoy / Ayer / "lun 5 jun"
        function formatDayLabel(dateStr) {
            const today = getLocalToday();
            if (dateStr === today) return 'Hoy';
            if (dateStr === shiftDateStr(today, -1)) return 'Ayer';
            if (dateStr === shiftDateStr(today, 1)) return 'Mañana';
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        // Medicamentos ocasionales más frecuentes (toda la familia) + semilla por defecto
        function getFrequentMeds() {
            const counts = {};
            store.logs.filter(l => l.med_id === null && l.name).forEach(l => {
                const key = `${l.name}||${l.dose || ''}`;
                counts[key] = (counts[key] || 0) + 1;
            });
            let list = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([key]) => { const [name, dose] = key.split('||'); return { name, dose }; });
            // Semilla para cuando hay poco historial
            const seed = [
                { name: 'Ibuprofeno', dose: '400mg' },
                { name: 'Paracetamol', dose: '500mg' },
                { name: 'Paracetamol', dose: '1g' }
            ];
            seed.forEach(s => {
                if (!list.some(x => x.name === s.name && (x.dose || '') === s.dose)) list.push(s);
            });
            return list.slice(0, 6);
        }

        // Nivel/color de temperatura (3 niveles febriles + normal)
        function tempLevel(t) {
            const v = parseFloat(t);
            if (v >= 38.5) return { label: 'Fiebre alta', text: 'text-[#A32D2D]', bg: 'bg-[#FCEBEB]', border: 'border-[#F09595]/60', dot: 'bg-[#E24B4A]', hex: '#A32D2D' };
            if (v >= 37.9) return { label: 'Fiebre', text: 'text-[#D85A30]', bg: 'bg-[#FAECE7]', border: 'border-[#F0997B]/60', dot: 'bg-[#D85A30]', hex: '#D85A30' };
            if (v >= 37.0) return { label: 'Febrícula', text: 'text-[#BA7517]', bg: 'bg-[#FAEEDA]', border: 'border-[#EF9F27]/60', dot: 'bg-[#EF9F27]', hex: '#BA7517' };
            return { label: 'Normal', text: 'text-[#0F6E56]', bg: 'bg-[#E1F5EE]', border: 'border-[#9FE1CB]/60', dot: 'bg-[#0F6E56]', hex: '#0F6E56' };
        }

        // Tendencia de la fiebre: describe el dato (no diagnostica). points = [{ms, temp}] ascendente.
        function feverTrend(points) {
            if (!points || points.length < 2) return null;
            const now = points[points.length - 1].ms;
            // Ventana reciente: últimas 14 h; si hay pocas lecturas, las últimas 4
            let win = points.filter(p => p.ms >= now - 14 * 3600000);
            if (win.length < 2) win = points.slice(-4);
            if (win.length < 2) return null;
            // Comparar promedio de la mitad reciente vs. la anterior (robusto a oscilaciones,
            // no se diluye en tramos largos como sí lo hacía la pendiente °/h)
            const half = Math.floor(win.length / 2) || 1;
            const earlier = win.slice(0, half);
            const recent = win.slice(-half);
            const avg = arr => arr.reduce((a, b) => a + b.temp, 0) / arr.length;
            const diff = avg(recent) - avg(earlier); // °C
            if (diff <= -0.3) return { text: 'la fiebre viene cediendo', dir: 'down' };
            if (diff >= 0.3) return { text: 'la temperatura viene en aumento', dir: 'up' };
            return { text: 'se mantiene estable', dir: 'flat' };
        }

        // --- EPISODIOS FEBRILES (Modo Fiebre) ---
        function activeEpisode(profileId) {
            return store.episodes
                .filter(e => e.profile_id === profileId && !e.ended_at)
                .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0] || null;
        }
        function episodeWindow(ep) {
            return { startMs: new Date(ep.started_at).getTime(), endMs: ep.ended_at ? new Date(ep.ended_at).getTime() : Date.now() };
        }
        // Lecturas, tomas y marcas del episodio (perfil), ascendente por tiempo
        function episodeData(ep, profileId) {
            const { startMs, endMs } = episodeWindow(ep);
            const inWin = ms => ms >= startMs - 60000 && ms <= endMs + 60000;
            const readings = store.temps.filter(t => t.profile_id === profileId)
                .map(t => ({ raw: t, ms: parseLocalDateTime(t.date, t.time).getTime(), temp: parseFloat(t.temp) }))
                .filter(x => !isNaN(x.temp) && inWin(x.ms)).sort((a, b) => a.ms - b.ms);
            const logs = store.logs.filter(l => l.profile_id === profileId)
                .map(l => ({ raw: l, ms: parseLocalDateTime(l.date, l.taken_at || l.time).getTime(), fam: matchAntipyretic(l.name) }))
                .filter(x => inWin(x.ms)).sort((a, b) => a.ms - b.ms);
            const doseMarks = logs.filter(x => x.fam);
            const stats = {
                pico: readings.length ? Math.max(...readings.map(r => r.temp)) : null,
                nLecturas: readings.length,
                nTomas: doseMarks.length,
                cadaHoras: null
            };
            if (doseMarks.length >= 2) {
                let sum = 0;
                for (let i = 1; i < doseMarks.length; i++) sum += (doseMarks[i].ms - doseMarks[i - 1].ms);
                stats.cadaHoras = Math.round((sum / (doseMarks.length - 1)) / 3600000 * 10) / 10;
            }
            return { startMs, endMs, readings, logs, doseMarks, stats };
        }

        // Gráfico SVG de la curva febril del episodio (zonas de 3 niveles + marcas de dosis)
        function feverChartSVG(ed, opts = {}) {
            const pts = ed.readings;
            if (pts.length < 2) return null;
            const marks = ed.doseMarks;
            const allMs = [...pts.map(p => p.ms), ...marks.map(m => m.ms)];
            let xMin = Math.min(...allMs), xMax = Math.max(...allMs);
            if (xMax - xMin < 3600000) xMax = xMin + 3600000;
            const PX0 = 40, PX1 = 320, PY0 = 20, PY1 = 150, TMIN = 36, TMAX = 40.5;
            const x = ms => PX0 + (ms - xMin) / (xMax - xMin) * (PX1 - PX0);
            const y = t => PY0 + (TMAX - t) / (TMAX - TMIN) * (PY1 - PY0);
            const dcolor = { ibuprofeno: '#0F6E56', dipirona: '#534AB7', paracetamol: '#BA7517' };
            const dinit = { ibuprofeno: 'I', dipirona: 'N', paracetamol: 'P' };
            let svg = opts.standalone
                ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 172" width="${opts.width || 680}" height="${opts.height || 344}">`
                : `<svg viewBox="0 0 340 172" width="100%" role="img" aria-label="Curva de temperatura del episodio">`;
            svg += `<rect x="${PX0}" y="${y(TMAX).toFixed(1)}" width="${PX1 - PX0}" height="${(y(38.5) - y(TMAX)).toFixed(1)}" fill="#F09595" opacity="0.18"/>`;
            svg += `<rect x="${PX0}" y="${y(38.5).toFixed(1)}" width="${PX1 - PX0}" height="${(y(37.9) - y(38.5)).toFixed(1)}" fill="#F0997B" opacity="0.18"/>`;
            svg += `<rect x="${PX0}" y="${y(37.9).toFixed(1)}" width="${PX1 - PX0}" height="${(y(37.0) - y(37.9)).toFixed(1)}" fill="#EF9F27" opacity="0.16"/>`;
            [37, 38, 39, 40].forEach(tp => {
                const yy = y(tp).toFixed(1);
                svg += `<line x1="${PX0}" y1="${yy}" x2="${PX1}" y2="${yy}" stroke="#ECEAE3" stroke-width="1"/>`;
                svg += `<text x="${PX0 - 6}" y="${(y(tp) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9C9A92" font-family="sans-serif">${tp}°</text>`;
            });
            // Banda de fechas: fecha de inicio + divisores en cada medianoche con su fecha
            const dm = ms => { const d = new Date(ms); return `${d.getDate()}/${d.getMonth() + 1}`; };
            svg += `<text x="${PX0}" y="12" text-anchor="start" font-size="9" font-weight="500" fill="#8A887F" font-family="sans-serif">${dm(xMin)}</text>`;
            const firstMid = new Date(xMin); firstMid.setHours(24, 0, 0, 0);
            for (let t = firstMid.getTime(); t < xMax; t += 86400000) {
                const gx = x(t).toFixed(1);
                svg += `<line x1="${gx}" y1="18" x2="${gx}" y2="150" stroke="#D3CFC5" stroke-width="1" stroke-dasharray="1 3"/>`;
                svg += `<text x="${(x(t) + 3).toFixed(1)}" y="12" text-anchor="start" font-size="9" font-weight="500" fill="#8A887F" font-family="sans-serif">${dm(t)}</text>`;
            }
            const poly = pts.map(p => `${x(p.ms).toFixed(1)},${y(p.temp).toFixed(1)}`).join(' ');
            svg += `<polyline points="${poly}" fill="none" stroke="#B23A2E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
            svg += `<g fill="#B23A2E">` + pts.map(p => `<circle cx="${x(p.ms).toFixed(1)}" cy="${y(p.temp).toFixed(1)}" r="3"/>`).join('') + `</g>`;
            marks.forEach(m => {
                const mx = x(m.ms).toFixed(1), c = dcolor[m.fam.key] || '#6B6A63', ini = dinit[m.fam.key] || '•';
                svg += `<line x1="${mx}" y1="150" x2="${mx}" y2="30" stroke="${c}" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5"/>`;
                svg += `<circle cx="${mx}" cy="150" r="6" fill="${c}"/><text x="${mx}" y="153" text-anchor="middle" font-size="8" font-weight="500" fill="#fff" font-family="sans-serif">${ini}</text>`;
            });
            const NT = 4;
            for (let i = 0; i <= NT; i++) { const ms = xMin + (xMax - xMin) * i / NT; svg += `<text x="${x(ms).toFixed(1)}" y="167" text-anchor="middle" font-size="9" fill="#9C9A92" font-family="sans-serif">${formatHM(new Date(ms))}</text>`; }
            svg += `</svg>`;
            return svg;
        }

        // Exporta el gráfico del episodio como PNG (con título, fechas y datos) y lo comparte o descarga
        async function exportFeverChart() {
            const ep = activeEpisode(store.currentProfile);
            if (!ep) return;
            const prof = store.profiles.find(x => x.id === store.currentProfile);
            const ed = episodeData(ep, store.currentProfile);
            const s = ed.stats;
            const chartSvg = feverChartSVG(ed, { standalone: true, width: 680, height: 344 });
            if (!chartSvg) { alert('Necesitás al menos 2 mediciones para el gráfico.'); return; }
            // rasterizar el SVG
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(chartSvg);
            const img = new Image();
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
            try { await document.fonts.ready; } catch(e) {}
            const scale = 2, W = 720, H = 480;
            const canvas = document.createElement('canvas');
            canvas.width = W * scale; canvas.height = H * scale;
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

        // --- GAMIFICACIÓN ---
        // Dosis programadas (med × horas) de un perfil en una fecha
        function scheduledDosesForDate(profileId, dateStr) {
            const meds = store.meds.filter(m => m.profile_id === profileId && isScheduledForDate(m, dateStr));
            let total = 0;
            meds.forEach(m => { total += (m.time ? m.time.split(',').filter(t => t).length : 1); });
            return total;
        }
        function takenDosesForDate(profileId, dateStr) {
            return store.logs.filter(l => l.profile_id === profileId && l.med_id !== null && l.date === dateStr).length;
        }
        // Día completo = todas las dosis programadas tomadas (y había al menos una)
        function isDayComplete(profileId, dateStr) {
            const sched = scheduledDosesForDate(profileId, dateStr);
            if (sched === 0) return null; // neutro: no cuenta ni rompe
            return takenDosesForDate(profileId, dateStr) >= sched;
        }
        // Racha: días consecutivos completos terminando hoy/ayer. Hoy en curso no rompe.
        function computeStreak(profileId) {
            let streak = 0;
            const today = getLocalToday();
            let cursor = today;
            // El día de hoy solo suma si ya está completo; si está en curso, no rompe.
            for (let i = 0; i < 400; i++) {
                const complete = isDayComplete(profileId, cursor);
                if (complete === null) { cursor = shiftDateStr(cursor, -1); continue; } // neutro: saltear
                if (complete) { streak++; }
                else { if (cursor === today) { cursor = shiftDateStr(cursor, -1); continue; } break; }
                cursor = shiftDateStr(cursor, -1);
            }
            return streak;
        }
        // Adherencia % en los últimos N días (solo días con programación)
        function computeAdherence(profileId, days = 7) {
            let sched = 0, taken = 0;
            let cursor = getLocalToday();
            for (let i = 0; i < days; i++) {
                const s = scheduledDosesForDate(profileId, cursor);
                if (s > 0) { sched += s; taken += Math.min(takenDosesForDate(profileId, cursor), s); }
                cursor = shiftDateStr(cursor, -1);
            }
            return sched === 0 ? null : Math.round((taken / sched) * 100);
        }

        // --- ASISTENTE DE PRÓXIMA DOSIS DE ANTIPIRÉTICOS ---
        // Familias reconocidas y su ventana entre tomas (horas). 6h es el lado seguro (espera ≥ mínimo).
        // hours = ventana por defecto; doseRules ajusta según la dosis (más miligramos, más espera)
        const ANTIPYRETICS = [
            { key: 'ibuprofeno', label: 'Ibuprofeno', hours: 6, match: ['ibuprofeno', 'ibupirac', 'ibuflex', 'actron'],
              doseRules: [{ minMg: 600, hours: 8 }] },
            { key: 'paracetamol', label: 'Paracetamol', hours: 6, match: ['paracetamol', 'tafirol', 'febrectal'],
              doseRules: [{ minMg: 1000, hours: 12 }] },
            { key: 'dipirona', label: 'Dipirona', hours: 6, match: ['dipirona', 'novalgina', 'metamizol'], doseRules: [] }
        ];
        function matchAntipyretic(name) {
            if (!name) return null;
            const n = name.toLowerCase();
            return ANTIPYRETICS.find(a => a.match.some(m => n.includes(m))) || null;
        }
        // Miligramos de una dosis escrita a mano ("600mg", "1g", "1gr"). null si no aplica (ej. "4ml").
        function doseToMg(doseStr) {
            if (!doseStr) return null;
            const m = String(doseStr).toLowerCase().match(/(\d+(?:[.,]\d+)?)\s*(mg|gr|g)\b/);
            if (!m) return null;
            const val = parseFloat(m[1].replace(',', '.'));
            if (isNaN(val)) return null;
            return m[2] === 'mg' ? val : val * 1000;
        }
        // Ventana efectiva entre tomas para una familia + dosis concreta
        function doseIntervalHours(fam, doseStr) {
            if (!fam) return 6;
            const mg = doseToMg(doseStr);
            if (mg != null && fam.doseRules && fam.doseRules.length) {
                const rule = [...fam.doseRules].sort((a, b) => b.minMg - a.minMg).find(r => mg >= r.minMg);
                if (rule) return rule.hours;
            }
            return fam.hours;
        }
        // Date local desde 'YYYY-MM-DD' + 'HH:MM' (sin bug de zona horaria; cruza medianoche al sumar horas)
        function parseLocalDateTime(dateStr, timeStr) {
            const [y, mo, d] = (dateStr || '').split('-').map(Number);
            const [h, mi] = (timeStr || '00:00').split(':').map(Number);
            return new Date(y, (mo || 1) - 1, d || 1, h || 0, mi || 0);
        }
        function formatHM(date) {
            return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
        }
        // Fecha corta d/m desde 'YYYY-MM-DD'
        function shortDM(dateStr) {
            const p = (dateStr || '').split('-');
            return p.length === 3 ? `${parseInt(p[2])}/${parseInt(p[1])}` : '';
        }
        function formatRemaining(ms) {
            if (ms < 0) ms = 0;
            const totalMin = Math.round(ms / 60000);
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h > 0 ? `${h} h ${String(m).padStart(2, '0')} m` : `${m} m`;
        }
        // Ventanas activas por familia (la toma más reciente que siga siendo relevante). Recalcula desde el reloj real.
        function getAntipyreticWindows(profileId) {
            const GRACE_MS = 6 * 3600000; // cuánto sigue visible la tarjeta después de habilitarse
            const now = new Date();
            const windows = [];
            ANTIPYRETICS.forEach(fam => {
                const doses = store.logs
                    .filter(l => l.med_id === null && l.profile_id === profileId && matchAntipyretic(l.name) === fam)
                    .map(l => ({ log: l, when: parseLocalDateTime(l.date, l.taken_at || l.time) }))
                    .filter(x => !isNaN(x.when.getTime()))
                    .sort((a, b) => b.when - a.when);
                if (!doses.length) return;
                const last = doses[0];
                const ageMs = now - last.when;
                // La ventana depende de la dosis de ESA toma (ej. ibuprofeno 600 espera 8 h, el 400 espera 6 h)
                const effHours = doseIntervalHours(fam, last.log.dose);
                // Sigue siendo relevante durante toda su ventana + un margen tras habilitarse
                if (ageMs < 0 || ageMs > effHours * 3600000 + GRACE_MS) return;
                const nextDose = new Date(last.when.getTime() + effHours * 3600000);
                const remainingMs = nextDose - now;
                windows.push({
                    key: fam.key, label: fam.label, hours: effHours,
                    lastMs: last.when.getTime(),
                    lastHM: formatHM(last.when), lastName: last.log.name, lastDose: last.log.dose || '',
                    nextHM: formatHM(nextDose), remainingMs, ready: remainingMs <= 0,
                    progress: Math.max(0, Math.min(100, Math.round((1 - remainingMs / (effHours * 3600000)) * 100)))
                });
            });
            windows.sort((a, b) => a.remainingMs - b.remainingMs);
            return windows;
        }

        // Alternancia: Novalgina (dipirona) como intermedia del Ibuprofeno, a mitad de ventana (3–3:30 h)
        // La intermedia va a mitad de la ventana del ancla (6 h → 3 h; 8 h → 4 h), en una franja de 30 min
        const ALTERNATION = { anchorKey: 'ibuprofeno', interKey: 'dipirona', interLabel: 'Novalgina', windowFraction: 0.5, spanHours: 0.5 };
        function computeAlternation(windows) {
            if (!windows.length) return null;
            // La toma más reciente entre todas las familias debe ser el ancla (ibuprofeno)
            const mostRecent = windows.reduce((a, b) => (b.lastMs > a.lastMs ? b : a));
            if (mostRecent.key !== ALTERNATION.anchorKey || mostRecent.ready) return null;
            const inter = windows.find(w => w.key === ALTERNATION.interKey);
            // Dos pisos para la intermedia: mitad de la ventana efectiva del ibuprofeno Y su propia ventana
            const dipOwnNextMs = inter ? (inter.lastMs + inter.hours * 3600000) : 0;
            const halfAnchorMs = mostRecent.hours * ALTERNATION.windowFraction * 3600000;
            const startMs = Math.max(mostRecent.lastMs + halfAnchorMs, dipOwnNextMs);
            const endMs = startMs + ALTERNATION.spanHours * 3600000; // franja de 30 min, nunca colapsa
            const now = Date.now();
            return {
                fromHM: formatHM(new Date(startMs)),
                toHM: formatHM(new Date(endMs)),
                state: now < startMs ? 'soon' : 'open',
                opensInMs: startMs - now
            };
        }

        async function init() {
            try {
                const { data: dbMeds } = await _db.from('medications').select('*');
                const { data: dbLogs } = await _db.from('logs').select('*');
                const { data: dbTemps } = await _db.from('temperatures').select('*');
                const { data: dbEps } = await _db.from('fever_episodes').select('*'); // tolera tabla inexistente (error → null)
                store.meds = dbMeds || [];
                store.logs = dbLogs || [];
                store.temps = dbTemps || [];
                store.episodes = dbEps || [];
                render();
                startClock();
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            } catch(e) { console.error(e); alert("Error de conexión"); }
        }

        function isScheduledForDate(med, dateStr) {
            // El filtro de stock agotado solo aplica al día de hoy: en días pasados
            // queremos poder registrar una toma olvidada aunque hoy esté sin stock.
            if (dateStr === getLocalToday() && med.track_stock && (med.stock === null || med.stock <= 0)) return false;
            // No cuenta como programado antes de darlo de alta: agregar algo nuevo no debe
            // generar "incumplimientos" retroactivos en la racha ni en la adherencia.
            const since = medStartDateStr(med);
            if (since && dateStr < since) return false;
            const [y, m, d] = dateStr.split('-').map(Number);
            const target = new Date(y, m - 1, d);
            if (!med.frequency_type || med.frequency_type === 'daily') return true;
            if (med.frequency_type === 'specific_days') {
                if (!med.frequency_days) return false;
                const dayOfWeek = target.getDay();
                return med.frequency_days.includes(dayOfWeek.toString());
            }
            if (med.frequency_type === 'interval') {
                if (!med.start_date || !med.interval_days) return false;
                const start = new Date(med.start_date);
                const current = new Date(dateStr);
                const diffTime = current - start;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return false;
                return (diffDays % med.interval_days) === 0;
            }
            return true;
        }

                store.selectedDate = next;
                render();
            },
            goToday: () => { store.selectedDate = getLocalToday(); render(); },

            applySuggestion: (name, dose) => {

                store.form.dose = dose;
                render();
            },

            applyFeverMed: (name, dose) => {
                store.form.medName = name;
                store.form.medDose = dose;
                render();
            },
            // Abrir el modal "Ocasional" con el nombre precargado (el usuario confirma dosis y hora)
            openOccasionalPrefill: (name) => {
                Actions.openModal('occasional');
                store.form.name = name;
                render();
            },

            // --- MODO FIEBRE ---
            startFeverMode: async () => {
                setBusy(true);
                try {
                    const { data, error } = await _db.from('fever_episodes').insert({ profile_id: store.currentProfile, started_at: new Date().toISOString() }).select();

            },
            endFeverMode: async () => {
                const ep = activeEpisode(store.currentProfile);
                if (!ep) { store.view = 'home'; render(); return; }
                if (!confirm('¿Cerrar el seguimiento de este episodio febril?')) return;
                setBusy(true);
                try {
                    const { data, error } = await _db.from('fever_episodes').update({ ended_at: new Date().toISOString() }).eq('id', ep.id).select();
                    if (error) throw error;
                    store.episodes = store.episodes.map(e => e.id === ep.id ? data[0] : e);

                } catch(e) { console.error(e); alert('Error cerrando el episodio'); } finally { setBusy(false); render(); }
            },
            openChartModal: () => { store.chartModal = true; render(); },
            closeChartModal: () => { store.chartModal = false; render(); },
            shareChart: async () => { const btn = document.getElementById('share-chart-btn'); if (btn) btn.textContent = 'Generando…'; try { await exportFeverChart(); } catch(e) { console.error(e); alert('No se pudo generar la imagen'); } if (btn) btn.innerHTML = `${I.Share} Compartir / descargar`; },

            // AHORA RECIBE HORA ESPECIFICA PARA NO CONFUNDIR TOMAS
            toggleTaken: async (medId, specificTime) => {
                setBusy(true);
                const med = store.meds.find(m => m.id === medId);
                const today = store.selectedDate;
                // Si registramos en un día pasado, la "hora real" es la programada (no la actual)
                const nowTime = (store.selectedDate === getLocalToday()) ? getLocalTime() : specificTime;
                // Para la micro-celebración: ¿el día estaba incompleto antes de marcar?
                const isRealToday = store.selectedDate === getLocalToday();
                const wasComplete = isDayComplete(store.currentProfile, today) === true;
                let celebrateNow = false;

                // Buscamos log exacto por ID, Fecha Y HORA específica
                const existingLog = store.logs.find(l => l.med_id === medId && l.date === today && l.time === specificTime);

                try {
                    if (existingLog) {
                        // Desmarcar
                        await _db.from('logs').delete().eq('id', existingLog.id);
                        let newStock = med.stock;
                        if(med.track_stock) {
                            newStock = (parseInt(med.stock)||0) + 1;
                            await _db.from('medications').update({ stock: newStock }).eq('id', medId);
                        }
                        store.logs = store.logs.filter(l => l.id !== existingLog.id);
                        med.stock = newStock;
                    } else {
                        // Marcar
                        const newLog = { 
                            med_id: med.id, 
                            profile_id: store.currentProfile, 
                            date: today, 
                            time: specificTime, // Guardamos la hora programada 
                            taken_at: nowTime, 
                            name: med.name, 
                            dose: med.dose 
                        };
                        const { data, error } = await _db.from('logs').insert(newLog).select();
                        if(error) throw error;
                        
                        let newStock = med.stock;
                        if(med.track_stock) {
                            newStock = Math.max(0, (parseInt(med.stock)||0) - 1);
                            await _db.from('medications').update({ stock: newStock }).eq('id', medId);
                        }
                        store.logs.push(data[0]);
                        med.stock = newStock;
                        // ¿Recién se completó el 100% del día de hoy?
                        if (isRealToday && !wasComplete && isDayComplete(store.currentProfile, today) === true) celebrateNow = true;
                    }
                } catch(e) { console.error(e); } finally { setBusy(false); render(); if (celebrateNow) celebrate(store.currentProfile); }

                    if (log.med_id) {

                        if (med && med.track_stock) {

                    }
                    store.logs = store.logs.filter(l => l.id !== logId);

            logAntipyreticDose: async (key) => {

            saveTemperature: async () => {
                // iOS muestra coma en el teclado decimal: aceptamos coma y la normalizamos a punto
                const raw = String(store.form.temp || '').replace(',', '.').trim();
                const tempVal = parseFloat(raw);

            addToCalendar: (medId, specificTime) => {
                const med = store.meds.find(m => m.id === medId);
                if (!med) return;
                const profile = store.profiles.find(p => p.id === med.profile_id);
                const now = new Date();
                const [hours, minutes] = specificTime.split(':');
                const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);
                const endDate = new Date(startDate.getTime() + 10 * 60000);
                const formatDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const title = encodeURIComponent(`💊 ${med.name} (${profile.name})`);
                const details = encodeURIComponent(`Dosis: ${med.dose}`);
                const dates = `${formatDate(startDate)}/${formatDate(endDate)}`;
                let recur = 'RRULE:FREQ=DAILY';
                if (med.frequency_type === 'specific_days') {
                    const map = { '1':'MO', '2':'TU', '3':'WE', '4':'TH', '5':'FR', '6':'SA', '0':'SU' };
                    const days = med.frequency_days.split(',').map(d => map[d]).join(',');
                    recur = `RRULE:FREQ=WEEKLY;BYDAY=${days}`;
                } else if (med.frequency_type === 'interval') {
                    recur = `RRULE:FREQ=DAILY;INTERVAL=${med.interval_days}`;
                }
                const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dates}&recur=${recur}`;
                window.open(url, '_blank');
            }
        };

        function render() {
            const p = store.profiles.find(x => x.id === store.currentProfile);

            const today = getLocalToday();

                    </div>

                    </div>

            let content = '';

            if (store.view === 'home') {
                // 1. Filtrar meds por el día seleccionado
                const scheduledMeds = meds.filter(m => isScheduledForDate(m, selDate));

                // 2. Expandir Multi-Horarios ("08:00,20:00" -> 2 items en la lista)
                let flatList = [];
                scheduledMeds.forEach(m => {
                    const times = m.time ? m.time.split(',') : ['??:??'];
                    times.forEach(t => {
                        flatList.push({
                            ...m,
                            displayTime: t, // Hora específica de esta tarjeta
                            isTaken: store.logs.some(l => l.med_id === m.id && l.date === selDate && l.time === t)
                        });
                    });
                });

                // 3. Ordenar por hora
                flatList.sort((a, b) => a.displayTime.localeCompare(b.displayTime));

                const takenCount = flatList.filter(x => x.isTaken).length;
                const totalCount = flatList.length;
                const remaining = totalCount - takenCount;
                const progress = totalCount ? Math.round((takenCount / totalCount) * 100) : 0;
                const alerts = meds.filter(m => m.track_stock && (parseInt(m.stock) <= parseInt(m.min_stock)));

                // Anillo de progreso (r=34 → circunferencia 213.6)
                const dashOffset = (213.6 * (1 - progress / 100)).toFixed(1);
                const adh = computeAdherence(store.currentProfile, 7);

                // Mensaje de aliento contextual
                let heroMsg;
                if (totalCount === 0) heroMsg = 'Sin dosis programadas';
                else if (progress === 100) heroMsg = '¡Día completo! 🎉';
                else if (remaining === 1) heroMsg = '¡Una más y cerrás el día!';
                else if (takenCount === 0) heroMsg = isToday ? 'Arranquemos el día' : 'Día pendiente';
                else heroMsg = `Vas por ${takenCount} de ${totalCount}`;

                // Modo fiebre activo del perfil (banner de entrada)
                const feverEp = isToday ? activeEpisode(store.currentProfile) : null;
                // Ventanas de antipiréticos (solo sobre "ahora", cuando estamos viendo hoy)
                const doseWindows = isToday ? getAntipyreticWindows(store.currentProfile) : [];
                const altHint = isToday ? computeAlternation(doseWindows) : null;
                // Con alternancia activa, la Dipirona se guía SOLO por la alternancia (evita tarjeta "habilitada" contradictoria)
                const visibleWindows = altHint ? doseWindows.filter(w => w.key !== ALTERNATION.interKey) : doseWindows;

                // Lecturas de temperatura del perfil para el día seleccionado
                const dayTemps = store.temps
                    .filter(t => t.profile_id === store.currentProfile && t.date === selDate)
                    .sort((a, b) => a.time.localeCompare(b.time));
                const lastTemp = dayTemps[dayTemps.length - 1];
                const lastLvl = lastTemp ? tempLevel(lastTemp.temp) : null;

                content = `
                    <div class="flex items-center justify-between gap-2 mb-4 bg-surface rounded-2xl p-1.5 shadow-soft border ${isToday ? 'border-hairline' : 'border-[#EF9F27]'}">

                                <div class="w-1/2"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Dosis</label><input type="text" value="${store.form.dose}" oninput="Actions.updateForm('dose', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#0F6E56]" placeholder="500mg"></div>
                                <div class="w-1/2">
                                    <label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Horarios</label>
                                    <div class="space-y-2">
                                        ${store.form.times.map((t, i) => `
                                            <div class="flex gap-1 items-center">
                                                <input type="time" value="${t}" oninput="Actions.updateTimeSlot(${i}, this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#0F6E56]">
                                                ${i > 0 ? `<button onclick="Actions.removeTimeSlot(${i})" class="px-2 text-red-400 active:text-red-600 font-bold text-xl">×</button>` : ''}
                                            </div>
                                        `).join('')}
                                        <button onclick="Actions.addTimeSlot()" class="text-xs text-[#0F6E56] font-bold py-1">+ Agregar hora</button>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-cream p-4 rounded-2xl border border-hairline">
                                <label class="text-xs font-bold text-muted uppercase tracking-wider mb-2 block">Frecuencia</label>
                                <select onchange="Actions.updateForm('frequencyType', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl mb-3">
                                    <option value="daily" ${store.form.frequencyType === 'daily' ? 'selected' : ''}>Todos los días</option>
                                    <option value="specific_days" ${store.form.frequencyType === 'specific_days' ? 'selected' : ''}>Días específicos</option>
                                    <option value="interval" ${store.form.frequencyType === 'interval' ? 'selected' : ''}>Intervalo</option>
                                </select>
                                ${store.form.frequencyType === 'specific_days' ? `<div class="flex justify-between gap-1 mb-2">${['L','M','M','J','V','S','D'].map((d, i) => { const val = (i + 1) % 7; const selected = store.form.frequencyDays.includes(val.toString()); return `<button onclick="Actions.toggleDay('${val}')" class="day-btn w-9 h-9 rounded-full text-xs font-bold border ${selected ? 'selected' : 'bg-surface border-hairline text-muted'}">${d}</button>` }).join('')}</div>` : ''}
                                ${store.form.frequencyType === 'interval' ? `<div class="flex gap-3"><div class="flex-1"><label class="text-xs text-muted mb-1 block">Cada (días)</label><input type="number" value="${store.form.intervalDays}" oninput="Actions.updateForm('intervalDays', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl"></div><div class="flex-1"><label class="text-xs text-muted mb-1 block">Inicio</label><input type="date" value="${store.form.startDate}" oninput="Actions.updateForm('startDate', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl"></div></div>` : ''}
                            </div>
                            <div class="bg-[#E1F5EE] p-4 rounded-2xl border border-[#9FE1CB]/50">
                                <label class="flex items-center gap-3 text-sm font-bold text-[#085041] mb-2 cursor-pointer select-none py-1"><input type="checkbox" ${store.form.trackStock ? 'checked' : ''} onchange="Actions.updateForm('trackStock', this.checked)" class="w-5 h-5 accent-[#0F6E56] rounded"> Controlar stock</label>
                                ${store.form.trackStock ? `<div class="flex gap-3 animate-fade-in mt-3"><div class="flex-1"><label class="text-xs text-[#0F6E56] font-semibold block mb-1">Cantidad</label><input type="number" value="${store.form.stock}" oninput="Actions.updateForm('stock', this.value)" class="w-full p-3 bg-surface border border-[#9FE1CB]/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#0F6E56]"></div><div class="flex-1"><label class="text-xs text-[#0F6E56] font-semibold block mb-1">Avisar con</label><input type="number" value="${store.form.minStock}" oninput="Actions.updateForm('minStock', this.value)" class="w-full p-3 bg-surface border border-[#9FE1CB]/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#0F6E56]"></div></div>` : ''}
                            </div>
                            <button onclick="Actions.saveForm()" class="w-full py-4 bg-[#0F6E56] text-white rounded-2xl font-bold text-lg shadow-soft active:scale-[0.98] transition-all mt-2">Guardar</button>
                            ${store.editId ? `<button onclick="Actions.deleteMed()" class="w-full py-3 text-red-500 font-bold text-sm active:bg-red-50 rounded-xl transition-all flex items-center justify-center gap-2">${I.Trash} Eliminar medicamento</button>` : ''}
                        </div>
                    `;
                } else if (store.modalType === 'occasional') {
                    modalContent = `
                        <div class="space-y-5">
                            <div class="bg-[#EEEDFE] p-3 rounded-2xl text-[#3C3489] text-sm font-semibold text-center mb-2 flex items-center justify-center gap-2">${I.Zap} Registro rápido</div>
                            <div><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Sugerencias</label>${chipRow('applySuggestion')}</div>
                            <div><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Qué tomaste</label><input type="text" value="${store.form.name}" oninput="Actions.updateForm('name', this.value)" class="w-full p-4 bg-cream rounded-2xl font-bold text-lg border border-hairline outline-none focus:ring-2 focus:ring-[#534AB7] transition-all" placeholder="Ej: Paracetamol"></div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Dosis</label><input type="text" value="${store.form.dose}" oninput="Actions.updateForm('dose', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#534AB7]" placeholder="500mg"></div>
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Hora</label><input type="time" value="${store.form.time}" oninput="Actions.updateForm('time', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#534AB7]"></div>
                            </div>
                            <button onclick="Actions.saveOccasional()" class="w-full py-4 bg-[#534AB7] text-white rounded-2xl font-bold text-lg shadow-soft active:scale-[0.98] transition-all mt-4">Registrar toma</button>
                        </div>
                    `;
                } else {
                    // MODAL DE FIEBRE
                    const commonTemps = ['36', '36.5', '37', '37.5', '38', '38.5', '39', '39.5'];
                    const curTemp = store.form.temp || '';                          // valor crudo (puede tener coma en iOS)
                    const curTempNorm = String(curTemp).replace(',', '.');          // normalizado para resaltar el chip
                    modalContent = `
                        <div class="space-y-5">
                            <div class="bg-[#FCEBEB] p-3 rounded-2xl text-[#A32D2D] text-sm font-semibold text-center mb-2 flex items-center justify-center gap-2">${I.Thermometer} Registro de temperatura</div>
                            <div>
                                <label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Temperatura (°C)</label>
                                <input type="text" inputmode="decimal" value="${curTemp}" oninput="Actions.updateForm('temp', this.value)" class="w-full p-4 bg-cream rounded-2xl font-extrabold text-2xl text-center border border-hairline outline-none focus:ring-2 focus:ring-red-500 transition-all" placeholder="38.5">
                                <div class="flex gap-2 mt-2 overflow-x-auto no-scrollbar -mx-1 px-1">
                                    ${commonTemps.map(t => `<button onclick="Actions.updateForm('temp', '${t}'); render()" class="shrink-0 text-sm font-bold px-3 py-1.5 rounded-lg transition-all ${curTempNorm === t ? 'bg-red-500 text-white' : 'bg-cream text-muted border border-hairline active:scale-95'}">${t}°</button>`).join('')}
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Hora</label><input type="time" value="${store.form.time}" oninput="Actions.updateForm('time', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-red-500"></div>
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Nota</label><input type="text" value="${store.form.note || ''}" oninput="Actions.updateForm('note', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-red-500" placeholder="Opcional"></div>
                            </div>
                            <div class="bg-cream p-4 rounded-2xl border border-hairline">
                                <label class="text-xs font-bold text-[#534AB7] uppercase tracking-wider mb-2 block">¿Le diste algo? (opcional)</label>
                                ${chipRow('applyFeverMed')}
                                <div class="flex gap-3 mt-3">
                                    <div class="flex-1"><input type="text" value="${store.form.medName || ''}" oninput="Actions.updateForm('medName', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl outline-none focus:ring-2 focus:ring-[#534AB7]" placeholder="Medicamento"></div>
                                    <div class="w-28"><input type="text" value="${store.form.medDose || ''}" oninput="Actions.updateForm('medDose', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl outline-none focus:ring-2 focus:ring-[#534AB7]" placeholder="Dosis"></div>
                                </div>
                            </div>
                            <button onclick="Actions.saveTemperature()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-bold text-lg shadow-soft active:scale-[0.98] transition-all mt-2">Registrar temperatura</button>
                        </div>
                    `;
                }

                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-ink/50 z-50 flex items-end sm:items-center justify-center p-3 animate-fade-in backdrop-blur-sm">
                        <div class="bg-surface w-full max-w-sm rounded-4xl p-6 shadow-lift animate-slide-up max-h-[88vh] overflow-y-auto no-scrollbar">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-extrabold text-xl text-ink tracking-tight">${store.modalType === 'regular' ? (store.editId ? 'Editar' : 'Nuevo medicamento') : (store.modalType === 'fever' ? 'Fiebre' : 'Toma ocasional')}</h3><button onclick="Actions.closeModal()" class="bg-cream p-2 rounded-full active:scale-90 text-muted transition-transform">${I.X}</button></div>
                            ${modalContent}
                        </div>
                    </div>`;
            } else if (store.chartModal) {
                const cep = activeEpisode(store.currentProfile);
                const cprof = store.profiles.find(x => x.id === store.currentProfile);
                let inner = '';
                if (cep) {
                    const ced = episodeData(cep, store.currentProfile);
                    const csvg = feverChartSVG(ced);
                    const cs = ced.stats;
                    inner = csvg
                        ? `<div class="mb-3">${csvg}</div>
                           <div class="flex gap-3 flex-wrap mb-3 px-1 text-[11px] text-muted">
                               <span class="flex items-center gap-1.5"><span style="width:12px;height:2.5px;background:#B23A2E;border-radius:2px;display:inline-block"></span>Temperatura</span>
                               <span class="flex items-center gap-1.5"><span style="width:9px;height:9px;border-radius:50%;background:#0F6E56;display:inline-block"></span>Ibuprofeno</span>
                               <span class="flex items-center gap-1.5"><span style="width:9px;height:9px;border-radius:50%;background:#534AB7;display:inline-block"></span>Novalgina</span>
                           </div>
                           <div class="grid grid-cols-4 gap-2 mb-4">
                               <div class="bg-[#FCEBEB] rounded-xl p-2 text-center"><p class="text-base font-extrabold text-[#A32D2D] leading-none">${cs.pico != null ? parseFloat(cs.pico).toFixed(1) + '°' : '—'}</p><p class="text-[10px] text-[#A32D2D]/70 mt-0.5">pico</p></div>
                               <div class="bg-cream rounded-xl p-2 text-center"><p class="text-base font-extrabold text-ink leading-none">${cs.nLecturas}</p><p class="text-[10px] text-muted mt-0.5 leading-tight">mediciones</p></div>
                               <div class="bg-cream rounded-xl p-2 text-center"><p class="text-base font-extrabold text-ink leading-none">${cs.nTomas}</p><p class="text-[10px] text-muted mt-0.5">tomas</p></div>
                               <div class="bg-cream rounded-xl p-2 text-center"><p class="text-base font-extrabold text-ink leading-none">${cs.cadaHoras != null ? '~' + cs.cadaHoras + 'h' : '—'}</p><p class="text-[10px] text-muted mt-0.5 leading-tight">cada (antipir.)</p></div>
                           </div>`
                        : `<p class="text-muted text-center py-8 font-medium">Necesitás al menos 2 mediciones para el gráfico.</p>`;
                }
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-ink/60 z-50 flex items-center justify-center p-3 animate-fade-in backdrop-blur-sm">
                        <div class="bg-surface w-full max-w-xl rounded-3xl p-5 shadow-lift animate-slide-up max-h-[92vh] overflow-y-auto no-scrollbar">
                            <div class="flex justify-between items-center mb-4"><div><h3 class="font-extrabold text-lg text-ink tracking-tight leading-none">Tendencia febril · ${cprof.name}</h3>${cep ? `<p class="text-xs text-muted font-medium mt-0.5">Episodio desde ${new Date(cep.started_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</p>` : ''}</div><button onclick="Actions.closeChartModal()" class="bg-cream p-2 rounded-full active:scale-90 text-muted transition-transform">${I.X}</button></div>
                            ${inner}
                            <button id="share-chart-btn" onclick="Actions.shareChart()" class="w-full py-3.5 bg-[#0F6E56] text-white rounded-2xl font-bold text-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2">${I.Share} Compartir / descargar</button>
                            <p class="text-[11px] text-muted/70 px-1 mt-3 text-center leading-snug">Genera una imagen del gráfico con los datos del episodio para mostrar o enviar al pediatra.</p>
                        </div>
                    </div>`;
            } else { document.getElementById('modal-container').innerHTML = ''; }
        }
        window.Actions = Actions;
        if (DEMO) {
            ['Ana', 'Pablo', 'Mateo'].forEach((n, i) => { store.profiles[i].name = n; });
            store.currentProfile = 3; // arranca en el perfil con el episodio febril en curso
            document.getElementById('demo-banner').style.display = 'block';
        }
        window.onload = init;
    </script>
</body>
</html>
