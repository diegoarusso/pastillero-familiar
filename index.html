        body { -webkit-tap-highlight-color: transparent; user-select: none; background-color: #FBFAF7; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; overscroll-behavior-y: none; }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        input, select, textarea { font-size: 16px !important; }

        .spinner { width: 40px; height: 40px; border: 3px solid #E1F5EE; border-top: 3px solid #0F6E56; border-radius: 50%; animation: spin 0.9s linear infinite; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1); }
        #toast { position: fixed; left: 50%; transform: translateX(-50%); top: 24px; z-index: 70; transition: all 0.4s cubic-bezier(0.16,1,0.3,1); opacity: 0; pointer-events: none; }

        // --- HELPERS DE FECHA (SOLUCIÓN AL BUG DE ZONA HORARIA) ---
        function getLocalToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getLocalTime() {
            return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
        }

        // Suma/resta días a un string YYYY-MM-DD sin problemas de zona horaria
        function shiftDateStr(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + days);
            const yy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        // Etiqueta amigable: Hoy / Ayer / "lun 5 jun"
        function formatDayLabel(dateStr) {
            const today = getLocalToday();
            if (dateStr === today) return 'Hoy';
            if (dateStr === shiftDateStr(today, -1)) return 'Ayer';
            if (dateStr === shiftDateStr(today, 1)) return 'Mañana';
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        // Medicamentos ocasionales más frecuentes (toda la familia) + semilla por defecto
        function getFrequentMeds() {
            const counts = {};
            store.logs.filter(l => l.med_id === null && l.name).forEach(l => {
                const key = `${l.name}||${l.dose || ''}`;
                counts[key] = (counts[key] || 0) + 1;
            });
            let list = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([key]) => { const [name, dose] = key.split('||'); return { name, dose }; });
            // Semilla para cuando hay poco historial
            const seed = [
                { name: 'Ibuprofeno', dose: '400mg' },
                { name: 'Paracetamol', dose: '500mg' },
                { name: 'Paracetamol', dose: '1g' }
            ];
            seed.forEach(s => {
                if (!list.some(x => x.name === s.name && (x.dose || '') === s.dose)) list.push(s);
            });
            return list.slice(0, 6);
        }

        // Nivel/color de temperatura
        function tempLevel(t) {
            const v = parseFloat(t);
            if (v >= 38.5) return { label: 'Fiebre alta', text: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200', dot: 'bg-red-500' };
            if (v >= 37.5) return { label: 'Febrícula', text: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-200', dot: 'bg-orange-400' };
            return { label: 'Normal', text: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200', dot: 'bg-green-500' };
        }

        // --- GAMIFICACIÓN ---
        // Dosis programadas (med × horas) de un perfil en una fecha
        function scheduledDosesForDate(profileId, dateStr) {
            const meds = store.meds.filter(m => m.profile_id === profileId && isScheduledForDate(m, dateStr));
            let total = 0;
            meds.forEach(m => { total += (m.time ? m.time.split(',').filter(t => t).length : 1); });
            return total;
        }
        function takenDosesForDate(profileId, dateStr) {
            return store.logs.filter(l => l.profile_id === profileId && l.med_id !== null && l.date === dateStr).length;
        }
        // Día completo = todas las dosis programadas tomadas (y había al menos una)
        function isDayComplete(profileId, dateStr) {
            const sched = scheduledDosesForDate(profileId, dateStr);
            if (sched === 0) return null; // neutro: no cuenta ni rompe
            return takenDosesForDate(profileId, dateStr) >= sched;
        }
        // Racha: días consecutivos completos terminando hoy/ayer. Hoy en curso no rompe.
        function computeStreak(profileId) {
            let streak = 0;
            const today = getLocalToday();
            let cursor = today;
            // El día de hoy solo suma si ya está completo; si está en curso, no rompe.
            for (let i = 0; i < 400; i++) {
                const complete = isDayComplete(profileId, cursor);
                if (complete === null) { cursor = shiftDateStr(cursor, -1); continue; } // neutro: saltear
                if (complete) { streak++; }
                else { if (cursor === today) { cursor = shiftDateStr(cursor, -1); continue; } break; }
                cursor = shiftDateStr(cursor, -1);
            }
            return streak;
        }
        // Adherencia % en los últimos N días (solo días con programación)
        function computeAdherence(profileId, days = 7) {
            let sched = 0, taken = 0;
            let cursor = getLocalToday();
            for (let i = 0; i < days; i++) {
                const s = scheduledDosesForDate(profileId, cursor);
                if (s > 0) { sched += s; taken += Math.min(takenDosesForDate(profileId, cursor), s); }
                cursor = shiftDateStr(cursor, -1);
            }
            return sched === 0 ? null : Math.round((taken / sched) * 100);
        }

        // Toast breve
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerHTML = `<div class="bg-ink text-white text-sm font-semibold px-4 py-2.5 rounded-full shadow-lift flex items-center gap-2">${msg}</div>`;
            el.classList.add('show');
            clearTimeout(window._toastT);
            window._toastT = setTimeout(() => el.classList.remove('show'), 2600);
        }
        // Micro-celebración al cerrar el 100% del día
        function celebrate(profileId) {
            const p = store.profiles.find(x => x.id === profileId);
            showToast('🎉 ¡Día completo!');
            if (typeof confetti === 'function') {
                const colors = [p ? p.hex : '#0F6E56', '#FAC775', '#9FE1CB'];
                confetti({ particleCount: 90, spread: 70, origin: { y: 0.7 }, colors, disableForReducedMotion: true });
            }
        }

        // --- ASISTENTE DE PRÓXIMA DOSIS DE ANTIPIRÉTICOS ---
        // Familias reconocidas y su ventana entre tomas (horas). 6h es el lado seguro (espera ≥ mínimo).
        const ANTIPYRETICS = [
            { key: 'ibuprofeno', label: 'Ibuprofeno', hours: 6, match: ['ibuprofeno', 'ibupirac', 'ibuflex', 'actron'] },
            { key: 'paracetamol', label: 'Paracetamol', hours: 6, match: ['paracetamol', 'tafirol', 'febrectal'] },
            { key: 'dipirona', label: 'Dipirona', hours: 6, match: ['dipirona', 'novalgina', 'metamizol'] }
        ];
        function matchAntipyretic(name) {
            if (!name) return null;
            const n = name.toLowerCase();
            return ANTIPYRETICS.find(a => a.match.some(m => n.includes(m))) || null;
        }
        // Date local desde 'YYYY-MM-DD' + 'HH:MM' (sin bug de zona horaria; cruza medianoche al sumar horas)
        function parseLocalDateTime(dateStr, timeStr) {
            const [y, mo, d] = (dateStr || '').split('-').map(Number);
            const [h, mi] = (timeStr || '00:00').split(':').map(Number);
            return new Date(y, (mo || 1) - 1, d || 1, h || 0, mi || 0);
        }
        function formatHM(date) {
            return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
        }
        function formatRemaining(ms) {
            if (ms < 0) ms = 0;
            const totalMin = Math.round(ms / 60000);
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h > 0 ? `${h} h ${String(m).padStart(2, '0')} m` : `${m} m`;
        }
        // Ventanas activas por familia (toma más reciente dentro de 12 h de relevancia). Recalcula desde el reloj real.
        function getAntipyreticWindows(profileId) {
            const RELEVANCE_MS = 12 * 3600000;
            const now = new Date();
            const windows = [];
            ANTIPYRETICS.forEach(fam => {
                const doses = store.logs
                    .filter(l => l.med_id === null && l.profile_id === profileId && matchAntipyretic(l.name) === fam)
                    .map(l => ({ log: l, when: parseLocalDateTime(l.date, l.taken_at || l.time) }))
                    .filter(x => !isNaN(x.when.getTime()))
                    .sort((a, b) => b.when - a.when);
                if (!doses.length) return;
                const last = doses[0];
                const ageMs = now - last.when;
                if (ageMs < 0 || ageMs > RELEVANCE_MS) return; // futura o ya no relevante
                const nextDose = new Date(last.when.getTime() + fam.hours * 3600000);
                const remainingMs = nextDose - now;
                windows.push({
                    key: fam.key, label: fam.label, hours: fam.hours,
                    lastHM: formatHM(last.when), lastName: last.log.name, lastDose: last.log.dose || '',
                    nextHM: formatHM(nextDose), remainingMs, ready: remainingMs <= 0,
                    progress: Math.max(0, Math.min(100, Math.round((1 - remainingMs / (fam.hours * 3600000)) * 100)))
                });
            });
            windows.sort((a, b) => a.remainingMs - b.remainingMs);
            return windows;
        }

        // Reloj en vivo: re-renderiza la cuenta regresiva desde el reloj real, y al despertar la pantalla.

            document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

                const { data: dbMeds } = await _db.from('medications').select('*');
                const { data: dbLogs } = await _db.from('logs').select('*');

        function isScheduledForDate(med, dateStr) {
            // El filtro de stock agotado solo aplica al día de hoy: en días pasados
            // queremos poder registrar una toma olvidada aunque hoy esté sin stock.
            if (dateStr === getLocalToday() && med.track_stock && (med.stock === null || med.stock <= 0)) return false;
            const [y, m, d] = dateStr.split('-').map(Number);
            const target = new Date(y, m - 1, d);
            if (!med.frequency_type || med.frequency_type === 'daily') return true;
            if (med.frequency_type === 'specific_days') {
                if (!med.frequency_days) return false;
                const dayOfWeek = target.getDay();
                return med.frequency_days.includes(dayOfWeek.toString());
            }
            if (med.frequency_type === 'interval') {
                if (!med.start_date || !med.interval_days) return false;
                const start = new Date(med.start_date);
                const current = new Date(dateStr);
                const diffTime = current - start;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return false;
                return (diffDays % med.interval_days) === 0;
            }
            return true;
        }

        const Actions = {
            setProfile: (id) => { store.currentProfile = id; render(); },

            // Navegación de fecha en la agenda (registro retroactivo)
            shiftDate: (days) => {
                const next = shiftDateStr(store.selectedDate, days);
                // No permitimos navegar al futuro
                if (next > getLocalToday()) return;
                store.selectedDate = next;
                render();
            },
            goToday: () => { store.selectedDate = getLocalToday(); render(); },

            // Autocompletar nombre+dosis desde un chip de sugerencia
            applySuggestion: (name, dose) => {
                store.form.name = name;
                store.form.dose = dose;
                render();
            },
            // Autocompletar el antipirético en el modal de fiebre
            applyFeverMed: (name, dose) => {
                store.form.medName = name;
                store.form.medDose = dose;
                render();
            },
            
            // AHORA RECIBE HORA ESPECIFICA PARA NO CONFUNDIR TOMAS
            toggleTaken: async (medId, specificTime) => {
                setBusy(true);
                const med = store.meds.find(m => m.id === medId);
                const today = store.selectedDate;
                // Si registramos en un día pasado, la "hora real" es la programada (no la actual)
                const nowTime = (store.selectedDate === getLocalToday()) ? getLocalTime() : specificTime;
                // Para la micro-celebración: ¿el día estaba incompleto antes de marcar?
                const isRealToday = store.selectedDate === getLocalToday();
                const wasComplete = isDayComplete(store.currentProfile, today) === true;
                let celebrateNow = false;

                // Buscamos log exacto por ID, Fecha Y HORA específica
                const existingLog = store.logs.find(l => l.med_id === medId && l.date === today && l.time === specificTime);

                try {
                    if (existingLog) {
                        // Desmarcar
                        await _db.from('logs').delete().eq('id', existingLog.id);
                        let newStock = med.stock;
                        if(med.track_stock) {
                            newStock = (parseInt(med.stock)||0) + 1;
                            await _db.from('medications').update({ stock: newStock }).eq('id', medId);
                        }
                        store.logs = store.logs.filter(l => l.id !== existingLog.id);
                        med.stock = newStock;
                    } else {
                        // Marcar
                        const newLog = { 
                            med_id: med.id, 
                            profile_id: store.currentProfile, 
                            date: today, 
                            time: specificTime, // Guardamos la hora programada 
                            taken_at: nowTime, 
                            name: med.name, 
                            dose: med.dose 
                        };
                        const { data, error } = await _db.from('logs').insert(newLog).select();
                        if(error) throw error;
                        
                        let newStock = med.stock;
                        if(med.track_stock) {
                            newStock = Math.max(0, (parseInt(med.stock)||0) - 1);
                            await _db.from('medications').update({ stock: newStock }).eq('id', medId);
                        }
                        store.logs.push(data[0]);
                        med.stock = newStock;
                        // ¿Recién se completó el 100% del día de hoy?
                        if (isRealToday && !wasComplete && isDayComplete(store.currentProfile, today) === true) celebrateNow = true;
                    }
                } catch(e) { console.error(e); } finally { setBusy(false); render(); if (celebrateNow) celebrate(store.currentProfile); }
            },

            deleteLog: async (logId) => {
                if(!confirm('¿Eliminar este registro?')) return;
                setBusy(true);
                const log = store.logs.find(l => l.id === logId);
                try {
                    await _db.from('logs').delete().eq('id', logId);
                    if (log.med_id) {
                        const med = store.meds.find(m => m.id === log.med_id);
                        if (med && med.track_stock) {
                            const newStock = (parseInt(med.stock)||0) + 1;
                            await _db.from('medications').update({ stock: newStock }).eq('id', med.id);
                            med.stock = newStock;
                        }
                    }
                    store.logs = store.logs.filter(l => l.id !== logId);
                } catch(e) { console.error(e); alert("Error borrando historial"); } finally { setBusy(false); render(); }
            },

            updateStock: async (id, amount) => {
                setBusy(true);
                const med = store.meds.find(m => m.id === id);
                const newStock = Math.max(0, (parseInt(med.stock)||0) + amount);
                med.stock = newStock;
                render();
                await _db.from('medications').update({ stock: newStock }).eq('id', id);
                setBusy(false);
            },

            saveForm: async () => {
                if(!store.form.name) return;
                setBusy(true);
                
                // Convertir array de horas a string (08:00,20:00)
                const timesString = store.form.times.filter(t => t).join(',');

                const medData = {
                    profile_id: store.currentProfile,
                    name: store.form.name, 
                    dose: store.form.dose, 
                    time: timesString, // Guardamos lista de horas
                    track_stock: store.form.trackStock,
                    stock: store.form.trackStock ? parseInt(store.form.stock) : null,
                    min_stock: store.form.trackStock ? parseInt(store.form.minStock) : 5,
                    frequency_type: store.form.frequencyType,
                    frequency_days: store.form.frequencyType === 'specific_days' ? store.form.frequencyDays.join(',') : null,
                    interval_days: store.form.frequencyType === 'interval' ? parseInt(store.form.intervalDays) : null,
                    start_date: store.form.frequencyType === 'interval' ? store.form.startDate : null
                };
                try {
                    if(store.editId) {
                        const { data } = await _db.from('medications').update(medData).eq('id', store.editId).select();
                        store.meds = store.meds.map(m => m.id === store.editId ? data[0] : m);
                    } else {
                        const { data } = await _db.from('medications').insert(medData).select();
                        store.meds.push(data[0]);
                    }
                    store.modal = false;
                } catch(e) { console.error(e); alert("Error guardando"); } finally { setBusy(false); render(); }
            },

            saveOccasional: async () => {
                if(!store.form.name) return;
                setBusy(true);
                const today = store.selectedDate;
                const time = store.form.time;
                
                const logData = {
                    profile_id: store.currentProfile,
                    name: store.form.name,
                    dose: store.form.dose,
                    date: today,
                    time: time,
                    taken_at: time,
                    med_id: null
                };

                try {
                    const { data, error } = await _db.from('logs').insert(logData).select();
                    if(error) throw error;
                    store.logs.push(data[0]);
                    store.modal = false;
                } catch(e) { console.error(e); alert("Error guardando"); } finally { setBusy(false); render(); }
            },

            // Anota otra toma del antipirético (reusa nombre+dosis de la última) y reinicia su ventana
            logAntipyreticDose: async (key) => {
                const fam = ANTIPYRETICS.find(a => a.key === key);
                if (!fam) return;
                const w = getAntipyreticWindows(store.currentProfile).find(x => x.key === key);
                const name = w ? w.lastName : fam.label;
                const dose = w ? w.lastDose : '';
                setBusy(true);
                const time = getLocalTime();
                const logData = { profile_id: store.currentProfile, name, dose, date: getLocalToday(), time, taken_at: time, med_id: null };
                try {
                    const { data, error } = await _db.from('logs').insert(logData).select();
                    if (error) throw error;
                    store.logs.push(data[0]);
                    showToast(`✔ ${fam.label} anotado ${time}`);
                } catch(e) { console.error(e); alert("Error anotando la toma"); } finally { setBusy(false); render(); }
            },

            saveTemperature: async () => {
                const tempVal = parseFloat(store.form.temp);
                if (!store.form.temp || isNaN(tempVal)) { alert("Ingresá una temperatura válida"); return; }
                setBusy(true);
                const date = store.selectedDate;
                const time = store.form.time;
                try {
                    let medLogId = null;
                    // Si se indicó un antipirético, registrarlo como toma ocasional vinculada
                    if (store.form.medName) {
                        const logData = {
                            profile_id: store.currentProfile,
                            name: store.form.medName,
                            dose: store.form.medDose || '',
                            date: date, time: time, taken_at: time, med_id: null
                        };
                        const { data: logIns, error: logErr } = await _db.from('logs').insert(logData).select();
                        if (logErr) throw logErr;
                        store.logs.push(logIns[0]);
                        medLogId = logIns[0].id;
                    }
                    const tempData = {
                        profile_id: store.currentProfile,
                        date: date, time: time,
                        temp: tempVal,
                        note: store.form.note || null,
                        med_log_id: medLogId
                    };
                    const { data, error } = await _db.from('temperatures').insert(tempData).select();
                    if (error) throw error;
                    store.temps.push(data[0]);
                    store.modal = false;
                } catch(e) { console.error(e); alert("Error guardando temperatura"); } finally { setBusy(false); render(); }
            },

            deleteTemp: async (id) => {
                if(!confirm('¿Eliminar este registro de temperatura?')) return;
                setBusy(true);
                const t = store.temps.find(x => x.id === id);
                try {
                    await _db.from('temperatures').delete().eq('id', id);
                    store.temps = store.temps.filter(x => x.id !== id);
                    // Borrar también el log del antipirético vinculado, si existe
                    if (t && t.med_log_id) {
                        await _db.from('logs').delete().eq('id', t.med_log_id);
                        store.logs = store.logs.filter(l => l.id !== t.med_log_id);
                    }
                } catch(e) { console.error(e); alert("Error borrando temperatura"); } finally { setBusy(false); render(); }
            },

            deleteMed: async () => {
                if(!confirm('¿Eliminar medicamento?')) return;
                setBusy(true);
                await _db.from('medications').delete().eq('id', store.editId);
                store.meds = store.meds.filter(m => m.id !== store.editId);
                store.modal = false;
                setBusy(false); render();
            },

            // GESTIÓN DE HORARIOS MULTIPLES
            addTimeSlot: () => {
                store.form.times.push('');
                render();
            },
            removeTimeSlot: (index) => {
                store.form.times.splice(index, 1);
                render();
            },
            updateTimeSlot: (index, val) => {
                store.form.times[index] = val;
                // No renderizamos aquí para no perder foco, igual que el nombre
            },

            openModal: (type = 'regular', id = null) => {
                store.modalType = type;
                store.editId = id;
                const todayStr = getLocalToday();
                const timeStr = getLocalTime();
                
                if (type === 'regular') {
                    if(id) {
                        const m = store.meds.find(x => x.id === id);
                        // Convertir string "08:00,20:00" a array ["08:00", "20:00"]
                        const timesArray = m.time ? m.time.split(',') : ['08:00'];
                        
                        store.form = { 
                            name: m.name, dose: m.dose, 
                            times: timesArray,
                            stock: m.stock, minStock: m.min_stock, trackStock: m.track_stock,
                            frequencyType: m.frequency_type || 'daily',
                            frequencyDays: m.frequency_days ? m.frequency_days.split(',') : [],
                            intervalDays: m.interval_days || 14,
                            startDate: m.start_date || todayStr
                        };
                    } else {
                        store.form = { name: '', dose: '', times: ['08:00'], stock: '', minStock: '5', trackStock: false, frequencyType: 'daily', frequencyDays: [], intervalDays: 14, startDate: todayStr };
                    }
                } else if (type === 'occasional') {
                    store.form = { name: '', dose: '', time: timeStr };
                } else {
                    // fiebre
                    store.form = { temp: '', time: timeStr, note: '', medName: '', medDose: '' };
                }
                store.modal = true;
                render();
            },
            closeModal: () => { store.modal = false; render(); },
            updateForm: (field, val) => { 
                store.form[field] = val; 
                if(['trackStock', 'frequencyType'].includes(field)) render();
            },
            toggleDay: (day) => {
                const days = store.form.frequencyDays;
                if(days.includes(day)) store.form.frequencyDays = days.filter(d => d !== day);
                else store.form.frequencyDays.push(day);
                render();
            },
            addToCalendar: (medId, specificTime) => {
                const med = store.meds.find(m => m.id === medId);
                if (!med) return;
                const profile = store.profiles.find(p => p.id === med.profile_id);
                const now = new Date();
                const [hours, minutes] = specificTime.split(':');
                const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);
                const endDate = new Date(startDate.getTime() + 10 * 60000);
                const formatDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const title = encodeURIComponent(`💊 ${med.name} (${profile.name})`);
                const details = encodeURIComponent(`Dosis: ${med.dose}`);
                const dates = `${formatDate(startDate)}/${formatDate(endDate)}`;
                let recur = 'RRULE:FREQ=DAILY';
                if (med.frequency_type === 'specific_days') {
                    const map = { '1':'MO', '2':'TU', '3':'WE', '4':'TH', '5':'FR', '6':'SA', '0':'SU' };
                    const days = med.frequency_days.split(',').map(d => map[d]).join(',');
                    recur = `RRULE:FREQ=WEEKLY;BYDAY=${days}`;
                } else if (med.frequency_type === 'interval') {
                    recur = `RRULE:FREQ=DAILY;INTERVAL=${med.interval_days}`;
                }
                const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dates}&recur=${recur}`;
                window.open(url, '_blank');
            }
        };

        function render() {
            const p = store.profiles.find(x => x.id === store.currentProfile);
            const meds = store.meds.filter(m => m.profile_id === store.currentProfile);
            const today = getLocalToday();
            const selDate = store.selectedDate;
            const isToday = selDate === today;

            const streak = computeStreak(store.currentProfile);
            document.getElementById('header-container').innerHTML = `
                <div class="bg-cream/95 backdrop-blur-md border-b border-hairline pt-safe">
                    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center gap-2.5">
                            <div class="${p.color} p-2 rounded-2xl text-white shadow-soft">${I.Pill}</div>
                            <div><h1 class="text-lg font-extrabold leading-none text-ink tracking-tight">Pastillero</h1><p class="text-xs text-muted font-medium mt-0.5">Tu salud, al día</p></div>
                        </div>
                        ${streak > 0
                            ? `<div class="flex items-center gap-1.5 ${p.light} ${p.text} pl-2.5 pr-3 py-1.5 rounded-full font-bold text-sm">${I.Flame}<span>${streak}</span></div>`
                            : `<div class="w-9 h-9 rounded-full ${p.color} text-white flex items-center justify-center font-bold border-2 border-white shadow-soft">${p.name[0]}</div>`}
                    </div>
                    <div class="max-w-md mx-auto px-4 pb-3 flex gap-2">
                        ${store.profiles.map(prof => `<button onclick="Actions.setProfile(${prof.id})" class="flex-1 py-2.5 px-3 rounded-2xl text-sm font-bold whitespace-nowrap transition-all ${store.currentProfile === prof.id ? `${prof.color} text-white shadow-soft` : 'bg-surface text-muted border border-hairline'}">${prof.name}</button>`).join('')}
                    </div>
                </div>`;

            let content = '';

            if (store.view === 'home') {
                // 1. Filtrar meds por el día seleccionado
                const scheduledMeds = meds.filter(m => isScheduledForDate(m, selDate));

                // 2. Expandir Multi-Horarios ("08:00,20:00" -> 2 items en la lista)
                let flatList = [];
                scheduledMeds.forEach(m => {
                    const times = m.time ? m.time.split(',') : ['??:??'];
                    times.forEach(t => {
                        flatList.push({
                            ...m,
                            displayTime: t, // Hora específica de esta tarjeta
                            isTaken: store.logs.some(l => l.med_id === m.id && l.date === selDate && l.time === t)
                        });
                    });
                });

                // 3. Ordenar por hora
                flatList.sort((a, b) => a.displayTime.localeCompare(b.displayTime));

                const takenCount = flatList.filter(x => x.isTaken).length;
                const totalCount = flatList.length;
                const remaining = totalCount - takenCount;
                const progress = totalCount ? Math.round((takenCount / totalCount) * 100) : 0;
                const alerts = meds.filter(m => m.track_stock && (parseInt(m.stock) <= parseInt(m.min_stock)));

                // Anillo de progreso (r=34 → circunferencia 213.6)
                const dashOffset = (213.6 * (1 - progress / 100)).toFixed(1);
                const adh = computeAdherence(store.currentProfile, 7);

                // Mensaje de aliento contextual
                let heroMsg;
                if (totalCount === 0) heroMsg = 'Sin dosis programadas';
                else if (progress === 100) heroMsg = '¡Día completo! 🎉';
                else if (remaining === 1) heroMsg = '¡Una más y cerrás el día!';
                else if (takenCount === 0) heroMsg = isToday ? 'Arranquemos el día' : 'Día pendiente';
                else heroMsg = `Vas por ${takenCount} de ${totalCount}`;

                // Ventanas de antipiréticos (solo sobre "ahora", cuando estamos viendo hoy)
                const doseWindows = isToday ? getAntipyreticWindows(store.currentProfile) : [];

                // Lecturas de temperatura del perfil para el día seleccionado
                const dayTemps = store.temps
                    .filter(t => t.profile_id === store.currentProfile && t.date === selDate)
                    .sort((a, b) => a.time.localeCompare(b.time));
                const lastTemp = dayTemps[dayTemps.length - 1];
                const lastLvl = lastTemp ? tempLevel(lastTemp.temp) : null;

                content = `
                    <div class="flex items-center justify-between gap-2 mb-4 bg-surface rounded-2xl p-1.5 shadow-soft border ${isToday ? 'border-hairline' : 'border-[#EF9F27]'}">
                        <button onclick="Actions.shiftDate(-1)" class="p-2 rounded-xl text-muted active:bg-cream transition-colors">${I.ChevronLeft}</button>
                        <button onclick="Actions.goToday()" class="flex-1 text-center ${isToday ? 'cursor-default' : 'cursor-pointer'}">
                            <p class="font-extrabold text-sm capitalize ${isToday ? 'text-ink' : 'text-[#BA7517]'}">${formatDayLabel(selDate)}</p>
                            ${!isToday ? `<p class="text-[10px] text-[#BA7517] font-bold uppercase tracking-wide">Tocá para volver a hoy</p>` : ''}
                        </button>
                        <button onclick="Actions.shiftDate(1)" class="p-2 rounded-xl transition-colors ${isToday ? 'text-hairline cursor-not-allowed' : 'text-muted active:bg-cream'}" ${isToday ? 'disabled' : ''}>${I.ChevronRight}</button>
                    </div>

                    <div class="bg-surface rounded-3xl p-5 shadow-soft border border-hairline mb-4 flex items-center gap-5">
                        <div class="relative shrink-0">
                            <svg width="84" height="84" viewBox="0 0 84 84">
                                <circle cx="42" cy="42" r="34" fill="none" stroke="${p.ring}" stroke-width="8"/>
                                <circle cx="42" cy="42" r="34" fill="none" stroke="${p.hex}" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="${dashOffset}" transform="rotate(-90 42 42)" style="transition: stroke-dashoffset .6s cubic-bezier(0.16,1,0.3,1)"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center"><span class="text-xl font-extrabold text-ink">${progress}%</span></div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-[11px] font-bold text-muted uppercase tracking-wider capitalize">${formatDayLabel(selDate)}</p>
                            <p class="text-lg font-extrabold text-ink leading-tight mt-0.5">${heroMsg}</p>
                            <div class="flex items-center gap-2 mt-2 flex-wrap">
                                <span class="text-xs font-bold ${p.light} ${p.text} px-2.5 py-1 rounded-full">${takenCount}/${totalCount} dosis</span>
                                ${adh !== null ? `<span class="text-xs font-semibold text-muted">Semana ${adh}%</span>` : ''}
                            </div>
                        </div>
                    </div>

                    ${doseWindows.length ? `<div class="space-y-2.5 mb-4">
                        ${doseWindows.map(w => w.ready ? `
                            <div class="bg-[#E1F5EE] border border-[#9FE1CB]/70 rounded-2xl p-4 animate-fade-in">
                                <div class="flex items-center gap-3">
                                    <div class="w-11 h-11 rounded-2xl bg-[#0F6E56] text-white flex items-center justify-center shrink-0">${I.Check}</div>
                                    <div class="flex-1 min-w-0">
                                        <p class="font-extrabold text-[#0F6E56] text-lg leading-tight">Ya podés dar ${w.label}</p>
                                        <p class="text-xs text-[#085041] font-medium mt-0.5">Última ${w.lastHM} · cada ${w.hours} h · habilitado desde ${w.nextHM} (hace ${formatRemaining(-w.remainingMs)})</p>
                                    </div>
                                </div>
                                <button onclick="Actions.logAntipyreticDose('${w.key}')" class="w-full mt-3 py-2.5 bg-[#0F6E56] text-white rounded-xl font-bold text-sm active:scale-95 transition-all flex items-center justify-center gap-2">${I.Plus} Anotar nueva toma ahora</button>
                            </div>` : `
                            <div class="bg-surface border border-[#EF9F27]/50 rounded-2xl p-4 shadow-soft animate-fade-in">
                                <div class="flex items-center gap-3">
                                    <div class="w-11 h-11 rounded-2xl bg-[#FAEEDA] text-[#BA7517] flex items-center justify-center shrink-0">${I.Hourglass}</div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-[11px] font-bold text-muted uppercase tracking-wider">Próxima dosis de ${w.label}</p>
                                        <p class="font-extrabold text-ink text-xl leading-tight">faltan ${formatRemaining(w.remainingMs)}</p>
                                    </div>
                                    <div class="text-right shrink-0"><p class="text-[10px] text-muted uppercase font-bold tracking-wide">a las</p><p class="font-extrabold text-[#BA7517] text-lg leading-none">${w.nextHM}</p></div>
                                </div>
                                <div class="h-2 bg-[#FAEEDA] rounded-full overflow-hidden mt-3"><div class="h-full bg-[#EF9F27] rounded-full transition-all duration-500" style="width: ${w.progress}%"></div></div>
                                <p class="text-xs text-muted font-medium mt-2">Última ${w.lastHM} · cada ${w.hours} h · desde las ${w.nextHM}</p>
                            </div>`).join('')}
                        <p class="text-[11px] text-muted/70 px-1 leading-snug">Recordatorio orientativo según la ventana de cada antipirético. Ante dudas, seguí la indicación del pediatra.</p>
                    </div>` : ''}

                    ${alerts.length ? `<div class="bg-[#FAEEDA] border border-[#EF9F27]/40 p-3.5 rounded-2xl flex gap-3 mb-4 animate-fade-in"><span class="text-[#BA7517] mt-0.5">${I.Alert}</span><div><p class="font-bold text-sm text-[#854F0B]">Reponer stock</p>${alerts.map(a => `<p class="text-xs text-[#854F0B]/80 mt-0.5 font-medium">• ${a.name}: quedan ${a.stock}</p>`).join('')}</div></div>` : ''}

                    ${dayTemps.length ? `<div class="${lastLvl.bg} border ${lastLvl.border} rounded-2xl p-4 mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <span class="${lastLvl.text}">${I.Thermometer}</span>
                                <div>
                                    <p class="text-[10px] font-bold text-muted uppercase tracking-wider">Última temperatura</p>
                                    <p class="text-2xl font-extrabold ${lastLvl.text} leading-none">${parseFloat(lastTemp.temp).toFixed(1)}°<span class="text-xs font-bold ml-2 align-middle">${lastLvl.label}</span></p>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-muted bg-white/70 px-2 py-1 rounded-lg">${lastTemp.time}</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                            ${dayTemps.map(t => { const lv = tempLevel(t.temp); return `<span class="text-xs font-bold ${lv.text} bg-white/80 border ${lv.border} px-2 py-1 rounded-lg flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${lv.dot}"></span>${t.time} · ${parseFloat(t.temp).toFixed(1)}°</span>`; }).join('')}
                        </div>
                    </div>` : ''}

                    <div class="grid grid-cols-3 gap-2 mb-5">
                        <button onclick="Actions.openModal('regular')" class="py-3 ${p.color} text-white rounded-2xl font-bold shadow-soft active:scale-95 transition-all flex flex-col items-center justify-center gap-1 text-xs">${I.Plus} Agendar</button>
                        <button onclick="Actions.openModal('occasional')" class="py-3 bg-surface text-ink border border-hairline rounded-2xl font-bold active:scale-95 transition-all flex flex-col items-center justify-center gap-1 text-xs">${I.Plus} Ocasional</button>
                        <button onclick="Actions.openModal('fever')" class="py-3 bg-[#FCEBEB] text-[#A32D2D] rounded-2xl font-bold active:scale-95 transition-all flex flex-col items-center justify-center gap-1 text-xs">${I.Thermometer} Fiebre</button>
                    </div>

                    <h3 class="font-extrabold text-ink text-lg mb-3 px-1">Agenda</h3>
                    <div class="space-y-2.5">
                        ${flatList.length === 0 ? `<div class="text-center py-12"><div class="w-16 h-16 ${p.light} ${p.text} rounded-full mx-auto mb-3 flex items-center justify-center">${I.Pill}</div><p class="text-muted font-medium">Nada programado para ${formatDayLabel(selDate).toLowerCase()}</p></div>` : flatList.map(m => `
                            <div class="bg-surface p-4 rounded-3xl shadow-soft border border-hairline flex flex-col gap-3 transition-all ${m.isTaken ? 'opacity-70' : ''}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3.5 flex-1 cursor-pointer min-w-0" onclick="Actions.openModal('regular', ${m.id})">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${p.light} ${p.text}">${I.Pill}</div>
                                        <div class="min-w-0"><p class="font-bold text-ink text-lg leading-tight truncate">${m.name}</p><p class="text-sm text-muted mt-0.5 font-medium truncate">${m.dose}</p></div>
                                    </div>
                                    <button onclick="Actions.toggleTaken(${m.id}, '${m.displayTime}')" class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 transition-all ${m.isTaken ? `${p.color} text-white shadow-soft scale-105` : 'border-2 border-hairline text-transparent active:scale-95'}">${I.Check}</button>
                                </div>
                                <div class="border-t border-hairline pt-2.5 flex justify-between items-center">
                                    <div class="flex items-center gap-1.5 text-xs text-muted font-bold bg-cream px-2.5 py-1 rounded-lg">${I.Clock} ${m.displayTime}</div>
                                    <button onclick="Actions.addToCalendar(${m.id}, '${m.displayTime}')" class="text-xs font-bold ${p.text} flex items-center gap-1 px-2 py-1 rounded-lg active:${p.light} transition-colors">${I.Calendar} Alarma</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;

            } else if (store.view === 'history') {
                // Unificamos tomas (logs) y mediciones de temperatura en una sola línea de tiempo
                const logItems = store.logs.filter(l => l.profile_id === store.currentProfile).map(l => ({ kind: 'log', date: l.date, time: l.taken_at || l.time, data: l }));
                const tempItems = store.temps.filter(t => t.profile_id === store.currentProfile).map(t => ({ kind: 'temp', date: t.date, time: t.time, data: t }));
                const items = [...logItems, ...tempItems];
                const grouped = {}; items.forEach(it => { if (!grouped[it.date]) grouped[it.date] = []; grouped[it.date].push(it); });
                content = `<h2 class="font-extrabold text-2xl text-ink mb-4 px-1 tracking-tight">Historial</h2>`;
                if (items.length === 0) content += `<div class="text-center py-12"><div class="w-16 h-16 ${p.light} ${p.text} rounded-full mx-auto mb-3 flex items-center justify-center">${I.History}</div><p class="text-muted font-medium">No hay registros</p></div>`;
                else {
                    content += `<div class="space-y-6">`;
                    Object.keys(grouped).sort().reverse().forEach(date => {
                        const dateStr = new Date(date + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                        const rows = grouped[date].sort((a, b) => (b.time || '').localeCompare(a.time || ''));
                        content += `<div><h3 class="text-xs font-bold uppercase text-muted mb-2 ml-1 sticky top-0 bg-cream/90 py-2 backdrop-blur-sm z-10 capitalize">${date === today ? 'Hoy' : dateStr}</h3><div class="bg-surface rounded-2xl shadow-soft border border-hairline overflow-hidden">${rows.map((it, idx) => {
                            const border = idx !== rows.length - 1 ? 'border-b border-hairline' : '';
                            if (it.kind === 'temp') {
                                const t = it.data; const lv = tempLevel(t.temp);
                                return `<div class="p-3.5 flex justify-between items-center ${border}">
                                    <div class="flex items-center gap-3">
                                        <div class="${lv.bg} ${lv.text} w-9 h-9 rounded-xl flex items-center justify-center">${I.Thermometer}</div>
                                        <div><p class="font-bold text-ink">${parseFloat(t.temp).toFixed(1)}° <span class="text-xs font-bold ${lv.text}">${lv.label}</span></p><p class="text-xs text-muted">${t.note ? t.note : 'Temperatura'}</p></div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <p class="font-bold text-muted text-sm">${t.time}</p>
                                        <button onclick="Actions.deleteTemp(${t.id})" class="text-hairline hover:text-red-500 active:text-red-500 p-2">${I.Trash}</button>
                                    </div>
                                </div>`;
                            }
                            const log = it.data;
                            return `<div class="p-3.5 flex justify-between items-center ${border}">
                                <div class="flex items-center gap-3">
                                    <div class="${log.med_id ? `${p.light} ${p.text}` : 'bg-[#EEEDFE] text-[#534AB7]'} w-9 h-9 rounded-xl flex items-center justify-center">${log.med_id ? I.Check : I.Zap}</div>
                                    <div><p class="font-bold text-ink">${log.name}</p><p class="text-xs text-muted">${log.dose}</p></div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <div class="text-right"><p class="font-bold text-muted text-sm">${log.taken_at || log.time}</p><p class="text-[10px] text-muted/70">${log.med_id ? 'Prog: '+log.time : 'Ocasional'}</p></div>
                                    <button onclick="Actions.deleteLog(${log.id})" class="text-hairline hover:text-red-500 active:text-red-500 p-2">${I.Trash}</button>
                                </div>
                            </div>`;
                        }).join('')}</div></div>`;
                    });
                    content += `</div>`;
                }

            } else if (store.view === 'stock') {
                content = `<h2 class="font-extrabold text-2xl text-ink mb-4 px-1 tracking-tight">Stock</h2><div class="grid grid-cols-2 gap-3">${meds.filter(m => m.track_stock).map(m => { const low = parseInt(m.stock) <= parseInt(m.min_stock); return `
                    <div class="bg-surface border border-hairline p-4 rounded-3xl shadow-soft relative flex flex-col justify-between h-40">
                        <div onclick="Actions.openModal('regular', ${m.id})" class="absolute top-1 right-1 p-3 text-muted/50 active:scale-90 cursor-pointer transition-transform">${I.Edit}</div>
                        <div class="mt-1"><h3 class="font-bold text-ink truncate pr-6">${m.name}</h3><div class="mt-1 flex items-end gap-1"><span class="text-4xl font-extrabold ${low ? 'text-red-500' : 'text-ink'}">${m.stock}</span><span class="text-xs text-muted mb-1.5 font-medium">unid.</span></div>${low ? `<span class="text-[10px] font-bold text-red-500 uppercase tracking-wide">Reponer</span>` : ''}</div>
                        <div class="flex gap-2 mt-2"><button onclick="Actions.updateStock(${m.id}, -1)" class="flex-1 bg-cream text-ink border border-hairline rounded-xl font-bold text-xl py-2 active:scale-95 transition-all">−</button><button onclick="Actions.updateStock(${m.id}, 1)" class="flex-1 ${p.color} text-white rounded-xl font-bold text-xl py-2 active:scale-95 transition-all">+</button></div>
                    </div>`; }).join('')}</div><button onclick="Actions.openModal('regular'); Actions.updateForm('trackStock', true)" class="w-full py-4 border-2 border-dashed border-hairline rounded-3xl text-muted font-bold flex items-center justify-center gap-2 mt-6 active:bg-surface transition-colors">${I.Plus} Añadir stock</button>`;
            }

            document.getElementById('app-content').innerHTML = content;
            const navItem = (view, icon, label) => `<button onclick="Actions.setView('${view}')" class="flex flex-col items-center gap-1 w-1/4 transition-colors ${store.view === view ? p.text : 'text-muted/60'}">${icon}<span class="text-[10px] font-bold">${label}</span></button>`;
            document.getElementById('nav-container').innerHTML = `<div class="max-w-md mx-auto flex justify-around items-center h-16">${navItem('home', I.Home, 'Hoy')}${navItem('history', I.History, 'Historial')}<div class="relative -top-6 w-1/4 flex justify-center"><button onclick="Actions.openModal('regular')" class="${p.color} text-white w-14 h-14 rounded-full shadow-lift flex items-center justify-center border-4 border-cream active:scale-95 transition-transform">${I.Plus}</button></div>${navItem('stock', I.Stock, 'Stock')}</div>`;

            if (store.modal) {
                let modalContent = '';

                // Fila de chips de medicamentos frecuentes (reutilizada en Ocasional y Fiebre)
                const freqMeds = getFrequentMeds();
                const chipRow = (fn) => `<div class="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1">${freqMeds.map(s => { const n = s.name.replace(/'/g, "\\'"); const d = (s.dose || '').replace(/'/g, "\\'"); return `<button onclick="Actions.${fn}('${n}', '${d}')" class="shrink-0 text-xs font-bold bg-cream text-ink border border-hairline px-3 py-2 rounded-xl active:scale-95 transition-all">${s.name}${s.dose ? ` <span class="text-muted">${s.dose}</span>` : ''}</button>`; }).join('')}</div>`;

                if (store.modalType === 'regular') {
                    // FORMULARIO REGULAR MULTI-HORA
                    modalContent = `
                        <div class="space-y-5">
                            <div><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Nombre</label><input type="text" value="${store.form.name}" oninput="Actions.updateForm('name', this.value)" class="w-full p-4 bg-cream rounded-2xl font-bold text-lg border border-hairline outline-none focus:ring-2 focus:ring-[#0F6E56] transition-all" placeholder="Ej: Ibuprofeno"></div>
                            <div class="flex gap-4">
                                <div class="w-1/2"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Dosis</label><input type="text" value="${store.form.dose}" oninput="Actions.updateForm('dose', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#0F6E56]" placeholder="500mg"></div>
                                <div class="w-1/2">
                                    <label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Horarios</label>
                                    <div class="space-y-2">
                                        ${store.form.times.map((t, i) => `
                                            <div class="flex gap-1 items-center">
                                                <input type="time" value="${t}" oninput="Actions.updateTimeSlot(${i}, this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#0F6E56]">
                                                ${i > 0 ? `<button onclick="Actions.removeTimeSlot(${i})" class="px-2 text-red-400 active:text-red-600 font-bold text-xl">×</button>` : ''}
                                            </div>
                                        `).join('')}
                                        <button onclick="Actions.addTimeSlot()" class="text-xs text-[#0F6E56] font-bold py-1">+ Agregar hora</button>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-cream p-4 rounded-2xl border border-hairline">
                                <label class="text-xs font-bold text-muted uppercase tracking-wider mb-2 block">Frecuencia</label>
                                <select onchange="Actions.updateForm('frequencyType', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl mb-3">
                                    <option value="daily" ${store.form.frequencyType === 'daily' ? 'selected' : ''}>Todos los días</option>
                                    <option value="specific_days" ${store.form.frequencyType === 'specific_days' ? 'selected' : ''}>Días específicos</option>
                                    <option value="interval" ${store.form.frequencyType === 'interval' ? 'selected' : ''}>Intervalo</option>
                                </select>
                                ${store.form.frequencyType === 'specific_days' ? `<div class="flex justify-between gap-1 mb-2">${['L','M','M','J','V','S','D'].map((d, i) => { const val = (i + 1) % 7; const selected = store.form.frequencyDays.includes(val.toString()); return `<button onclick="Actions.toggleDay('${val}')" class="day-btn w-9 h-9 rounded-full text-xs font-bold border ${selected ? 'selected' : 'bg-surface border-hairline text-muted'}">${d}</button>` }).join('')}</div>` : ''}
                                ${store.form.frequencyType === 'interval' ? `<div class="flex gap-3"><div class="flex-1"><label class="text-xs text-muted mb-1 block">Cada (días)</label><input type="number" value="${store.form.intervalDays}" oninput="Actions.updateForm('intervalDays', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl"></div><div class="flex-1"><label class="text-xs text-muted mb-1 block">Inicio</label><input type="date" value="${store.form.startDate}" oninput="Actions.updateForm('startDate', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl"></div></div>` : ''}
                            </div>
                            <div class="bg-[#E1F5EE] p-4 rounded-2xl border border-[#9FE1CB]/50">
                                <label class="flex items-center gap-3 text-sm font-bold text-[#085041] mb-2 cursor-pointer select-none py-1"><input type="checkbox" ${store.form.trackStock ? 'checked' : ''} onchange="Actions.updateForm('trackStock', this.checked)" class="w-5 h-5 accent-[#0F6E56] rounded"> Controlar stock</label>
                                ${store.form.trackStock ? `<div class="flex gap-3 animate-fade-in mt-3"><div class="flex-1"><label class="text-xs text-[#0F6E56] font-semibold block mb-1">Cantidad</label><input type="number" value="${store.form.stock}" oninput="Actions.updateForm('stock', this.value)" class="w-full p-3 bg-surface border border-[#9FE1CB]/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#0F6E56]"></div><div class="flex-1"><label class="text-xs text-[#0F6E56] font-semibold block mb-1">Avisar con</label><input type="number" value="${store.form.minStock}" oninput="Actions.updateForm('minStock', this.value)" class="w-full p-3 bg-surface border border-[#9FE1CB]/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#0F6E56]"></div></div>` : ''}
                            </div>
                            <button onclick="Actions.saveForm()" class="w-full py-4 bg-[#0F6E56] text-white rounded-2xl font-bold text-lg shadow-soft active:scale-[0.98] transition-all mt-2">Guardar</button>
                            ${store.editId ? `<button onclick="Actions.deleteMed()" class="w-full py-3 text-red-500 font-bold text-sm active:bg-red-50 rounded-xl transition-all flex items-center justify-center gap-2">${I.Trash} Eliminar medicamento</button>` : ''}
                        </div>
                    `;
                } else if (store.modalType === 'occasional') {
                    modalContent = `
                        <div class="space-y-5">
                            <div class="bg-[#EEEDFE] p-3 rounded-2xl text-[#3C3489] text-sm font-semibold text-center mb-2 flex items-center justify-center gap-2">${I.Zap} Registro rápido</div>
                            <div><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Sugerencias</label>${chipRow('applySuggestion')}</div>
                            <div><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Qué tomaste</label><input type="text" value="${store.form.name}" oninput="Actions.updateForm('name', this.value)" class="w-full p-4 bg-cream rounded-2xl font-bold text-lg border border-hairline outline-none focus:ring-2 focus:ring-[#534AB7] transition-all" placeholder="Ej: Paracetamol"></div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Dosis</label><input type="text" value="${store.form.dose}" oninput="Actions.updateForm('dose', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#534AB7]" placeholder="500mg"></div>
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Hora</label><input type="time" value="${store.form.time}" oninput="Actions.updateForm('time', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-[#534AB7]"></div>
                            </div>
                            <button onclick="Actions.saveOccasional()" class="w-full py-4 bg-[#534AB7] text-white rounded-2xl font-bold text-lg shadow-soft active:scale-[0.98] transition-all mt-4">Registrar toma</button>
                        </div>
                    `;
                } else {
                    // MODAL DE FIEBRE
                    const commonTemps = ['37', '37.5', '38', '38.5', '39', '39.5'];
                    const curTemp = store.form.temp || '';
                    modalContent = `
                        <div class="space-y-5">
                            <div class="bg-[#FCEBEB] p-3 rounded-2xl text-[#A32D2D] text-sm font-semibold text-center mb-2 flex items-center justify-center gap-2">${I.Thermometer} Registro de temperatura</div>
                            <div>
                                <label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Temperatura (°C)</label>
                                <input type="number" inputmode="decimal" step="0.1" value="${curTemp}" oninput="Actions.updateForm('temp', this.value)" class="w-full p-4 bg-cream rounded-2xl font-extrabold text-2xl text-center border border-hairline outline-none focus:ring-2 focus:ring-red-500 transition-all" placeholder="38.0">
                                <div class="flex gap-2 mt-2 overflow-x-auto no-scrollbar -mx-1 px-1">
                                    ${commonTemps.map(t => `<button onclick="Actions.updateForm('temp', '${t}'); render()" class="shrink-0 text-sm font-bold px-3 py-1.5 rounded-lg transition-all ${curTemp === t ? 'bg-red-500 text-white' : 'bg-cream text-muted border border-hairline active:scale-95'}">${t}°</button>`).join('')}
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Hora</label><input type="time" value="${store.form.time}" oninput="Actions.updateForm('time', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-red-500"></div>
                                <div class="flex-1"><label class="text-xs font-bold text-muted uppercase tracking-wider mb-1.5 block">Nota</label><input type="text" value="${store.form.note || ''}" oninput="Actions.updateForm('note', this.value)" class="w-full p-4 bg-cream rounded-2xl border border-hairline outline-none focus:ring-2 focus:ring-red-500" placeholder="Opcional"></div>
                            </div>
                            <div class="bg-cream p-4 rounded-2xl border border-hairline">
                                <label class="text-xs font-bold text-[#534AB7] uppercase tracking-wider mb-2 block">¿Le diste algo? (opcional)</label>
                                ${chipRow('applyFeverMed')}
                                <div class="flex gap-3 mt-3">
                                    <div class="flex-1"><input type="text" value="${store.form.medName || ''}" oninput="Actions.updateForm('medName', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl outline-none focus:ring-2 focus:ring-[#534AB7]" placeholder="Medicamento"></div>
                                    <div class="w-28"><input type="text" value="${store.form.medDose || ''}" oninput="Actions.updateForm('medDose', this.value)" class="w-full p-3 bg-surface border border-hairline rounded-xl outline-none focus:ring-2 focus:ring-[#534AB7]" placeholder="Dosis"></div>
                                </div>
                            </div>
                            <button onclick="Actions.saveTemperature()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-bold text-lg shadow-soft active:scale-[0.98] transition-all mt-2">Registrar temperatura</button>
                        </div>
                    `;
                }

                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-ink/50 z-50 flex items-end sm:items-center justify-center p-3 animate-fade-in backdrop-blur-sm">
                        <div class="bg-surface w-full max-w-sm rounded-4xl p-6 shadow-lift animate-slide-up max-h-[88vh] overflow-y-auto no-scrollbar">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-extrabold text-xl text-ink tracking-tight">${store.modalType === 'regular' ? (store.editId ? 'Editar' : 'Nuevo medicamento') : (store.modalType === 'fever' ? 'Fiebre' : 'Toma ocasional')}</h3><button onclick="Actions.closeModal()" class="bg-cream p-2 rounded-full active:scale-90 text-muted transition-transform">${I.X}</button></div>
                            ${modalContent}
                        </div>
                    </div>`;
            } else { document.getElementById('modal-container').innerHTML = ''; }
        }
        window.Actions = Actions;
        window.onload = init;
    </script>
</body>
</html>
