        // --- HELPERS DE FECHA (SOLUCIÓN AL BUG DE ZONA HORARIA) ---
        function getLocalToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getLocalTime() {
            return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
        }

        // Suma/resta días a un string YYYY-MM-DD sin problemas de zona horaria
        function shiftDateStr(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + days);
            const yy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        // Etiqueta amigable: Hoy / Ayer / "lun 5 jun"
        function formatDayLabel(dateStr) {
            const today = getLocalToday();
            if (dateStr === today) return 'Hoy';
            if (dateStr === shiftDateStr(today, -1)) return 'Ayer';
            if (dateStr === shiftDateStr(today, 1)) return 'Mañana';
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        // Medicamentos ocasionales más frecuentes (toda la familia) + semilla por defecto
        function getFrequentMeds() {
            const counts = {};
            store.logs.filter(l => l.med_id === null && l.name).forEach(l => {
                const key = `${l.name}||${l.dose || ''}`;
                counts[key] = (counts[key] || 0) + 1;
            });
            let list = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([key]) => { const [name, dose] = key.split('||'); return { name, dose }; });
            // Semilla para cuando hay poco historial
            const seed = [
                { name: 'Ibuprofeno', dose: '400mg' },
                { name: 'Paracetamol', dose: '500mg' },
                { name: 'Paracetamol', dose: '1g' }
            ];
            seed.forEach(s => {
                if (!list.some(x => x.name === s.name && (x.dose || '') === s.dose)) list.push(s);
            });
            return list.slice(0, 6);
        }

        function isScheduledForDate(med, dateStr) {
            // El filtro de stock agotado solo aplica al día de hoy: en días pasados
            // queremos poder registrar una toma olvidada aunque hoy esté sin stock.
            if (dateStr === getLocalToday() && med.track_stock && (med.stock === null || med.stock <= 0)) return false;
            const [y, m, d] = dateStr.split('-').map(Number);
            const target = new Date(y, m - 1, d);
            if (!med.frequency_type || med.frequency_type === 'daily') return true;
            if (med.frequency_type === 'specific_days') {
                if (!med.frequency_days) return false;
                const dayOfWeek = target.getDay();
                return med.frequency_days.includes(dayOfWeek.toString());
            }
            if (med.frequency_type === 'interval') {
                if (!med.start_date || !med.interval_days) return false;
                const start = new Date(med.start_date);
                const current = new Date(dateStr);
                const diffTime = current - start;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return false;
                return (diffDays % med.interval_days) === 0;
            }
            return true;
        }

                setBusy(true);
                const med = store.meds.find(m => m.id === medId);
                const today = store.selectedDate;
                // Si registramos en un día pasado, la "hora real" es la programada (no la actual)
                const nowTime = (store.selectedDate === getLocalToday()) ? getLocalTime() : specificTime;

                // Buscamos log exacto por ID, Fecha Y HORA específica

                try {
                    if (existingLog) {
                        // Desmarcar
                        await _db.from('logs').delete().eq('id', existingLog.id);
                        let newStock = med.stock;
                        if(med.track_stock) {
                            newStock = (parseInt(med.stock)||0) + 1;
                            await _db.from('medications').update({ stock: newStock }).eq('id', medId);

                            date: today, 
                            time: specificTime, // Guardamos la hora programada 
                            taken_at: nowTime, 
                            name: med.name, 
                            dose: med.dose 
                        };
                        const { data, error } = await _db.from('logs').insert(newLog).select();

                        let newStock = med.stock;
                        if(med.track_stock) {
                            newStock = Math.max(0, (parseInt(med.stock)||0) - 1);
                            await _db.from('medications').update({ stock: newStock }).eq('id', medId);

                        store.logs.push(data[0]);
                        med.stock = newStock;
                    }
                } catch(e) { console.error(e); } finally { setBusy(false); render(); }

                if(!store.form.name) return;

            toggleDay: (day) => {

                if(days.includes(day)) store.form.frequencyDays = days.filter(d => d !== day);
                else store.form.frequencyDays.push(day);
                render();
            },
            addToCalendar: (medId, specificTime) => {
                const med = store.meds.find(m => m.id === medId);
                if (!med) return;
                const profile = store.profiles.find(p => p.id === med.profile_id);
                const now = new Date();
                const [hours, minutes] = specificTime.split(':');
                const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);
                const endDate = new Date(startDate.getTime() + 10 * 60000);
                const formatDate = (date) => date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const title = encodeURIComponent(`💊 ${med.name} (${profile.name})`);
                const details = encodeURIComponent(`Dosis: ${med.dose}`);
                const dates = `${formatDate(startDate)}/${formatDate(endDate)}`;
                let recur = 'RRULE:FREQ=DAILY';
                if (med.frequency_type === 'specific_days') {
                    const map = { '1':'MO', '2':'TU', '3':'WE', '4':'TH', '5':'FR', '6':'SA', '0':'SU' };
                    const days = med.frequency_days.split(',').map(d => map[d]).join(',');
                    recur = `RRULE:FREQ=WEEKLY;BYDAY=${days}`;
                } else if (med.frequency_type === 'interval') {
                    recur = `RRULE:FREQ=DAILY;INTERVAL=${med.interval_days}`;
                }
                const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dates}&recur=${recur}`;
                window.open(url, '_blank');
            }
        };

        function render() {
            const p = store.profiles.find(x => x.id === store.currentProfile);
            const meds = store.meds.filter(m => m.profile_id === store.currentProfile);
            const today = getLocalToday();
            const selDate = store.selectedDate;
            const isToday = selDate === today;

            document.getElementById('header-container').innerHTML = `
                <div class="bg-white border-b border-gray-100 shadow-sm pt-safe">
                    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-2 rounded-xl text-white shadow-lg shadow-blue-200">${I.Pill}</div>
                            <div><h1 class="text-lg font-bold leading-none text-gray-800">Pastillero</h1><p class="text-xs text-gray-500">Cloud 2.0</p></div>
                        </div>
                        <div class="w-9 h-9 rounded-full ${p.color} text-white flex items-center justify-center font-bold shadow border-2 border-white">${p.name[0]}</div>
                    </div>
                    <div class="max-w-md mx-auto px-4 pb-3 flex gap-2 overflow-x-auto no-scrollbar">
                        ${store.profiles.map(prof => `<button onclick="Actions.setProfile(${prof.id})" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-bold whitespace-nowrap transition-all ${store.currentProfile === prof.id ? `${prof.color} text-white shadow-md scale-[1.02]` : 'bg-gray-100 text-gray-500'}">${prof.name}</button>`).join('')}
                    </div>
                </div>`;

            let content = '';

            if (store.view === 'home') {
                // 1. Filtrar meds por el día seleccionado
                const scheduledMeds = meds.filter(m => isScheduledForDate(m, selDate));

                // 2. Expandir Multi-Horarios ("08:00,20:00" -> 2 items en la lista)
                let flatList = [];
                scheduledMeds.forEach(m => {
                    const times = m.time ? m.time.split(',') : ['??:??'];
                    times.forEach(t => {
                        flatList.push({
                            ...m,
                            displayTime: t, // Hora específica de esta tarjeta
                            isTaken: store.logs.some(l => l.med_id === m.id && l.date === selDate && l.time === t)
                        });
                    });
                });

                // 3. Ordenar por hora
                flatList.sort((a, b) => a.displayTime.localeCompare(b.displayTime));

                const progress = flatList.length ? Math.round((flatList.filter(x => x.isTaken).length / flatList.length) * 100) : 0;
                const alerts = meds.filter(m => m.track_stock && (parseInt(m.stock) <= parseInt(m.min_stock)));

                // Lecturas de temperatura del perfil para el día seleccionado
                const dayTemps = store.temps
                    .filter(t => t.profile_id === store.currentProfile && t.date === selDate)
                    .sort((a, b) => a.time.localeCompare(b.time));
                const lastTemp = dayTemps[dayTemps.length - 1];
                const lastLvl = lastTemp ? tempLevel(lastTemp.temp) : null;

                content = `
                    <div class="flex items-center justify-between gap-2 mb-4 bg-white rounded-2xl p-1.5 shadow-sm border ${isToday ? 'border-gray-100' : 'border-amber-300'}">
                        <button onclick="Actions.shiftDate(-1)" class="p-2 rounded-xl text-gray-500 active:bg-gray-100 transition-colors">${I.ChevronLeft}</button>
                        <button onclick="Actions.goToday()" class="flex-1 text-center ${isToday ? 'cursor-default' : 'cursor-pointer'}">
                            <p class="font-bold text-sm capitalize ${isToday ? 'text-gray-700' : 'text-amber-600'}">${formatDayLabel(selDate)}</p>
                            ${!isToday ? `<p class="text-[10px] text-amber-500 font-bold uppercase tracking-wide">Tocá para volver a hoy</p>` : ''}
                        </button>
                        <button onclick="Actions.shiftDate(1)" class="p-2 rounded-xl transition-colors ${isToday ? 'text-gray-200 cursor-not-allowed' : 'text-gray-500 active:bg-gray-100'}" ${isToday ? 'disabled' : ''}>${I.ChevronRight}</button>
                    </div>

                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
                        <div class="flex justify-between items-end mb-3">
                            <div><p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider capitalize">${formatDayLabel(selDate)}</p><h2 class="text-3xl font-bold text-gray-800">${progress}%</h2></div>
                            <div class="text-xs font-bold bg-gray-50 px-3 py-1.5 rounded-lg text-gray-600 border border-gray-100">${flatList.filter(x => x.isTaken).length}/${flatList.length} Dosis</div>
                        </div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden"><div class="h-full transition-all duration-500 ${p.color}" style="width: ${progress}%"></div></div>
                    </div>
                    ${alerts.length ? `<div class="bg-orange-50 border-l-4 border-orange-400 p-3 rounded-r-xl flex gap-3 mb-4 shadow-sm animate-fade-in"><span class="text-orange-500 mt-0.5">${I.Alert}</span><div><p class="font-bold text-sm text-orange-800">Reponer Stock</p>${alerts.map(a => `<p class="text-xs text-orange-700 mt-0.5">• ${a.name}: Quedan ${a.stock}</p>`).join('')}</div></div>` : ''}

                    ${dayTemps.length ? `<div class="${lastLvl.bg} border ${lastLvl.border} rounded-2xl p-4 mb-5 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <span class="${lastLvl.text}">${I.Thermometer}</span>
                                <div>
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Última temperatura</p>
                                    <p class="text-2xl font-bold ${lastLvl.text} leading-none">${parseFloat(lastTemp.temp).toFixed(1)}°<span class="text-xs font-bold ml-2 align-middle">${lastLvl.label}</span></p>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-gray-500 bg-white/70 px-2 py-1 rounded-lg">${lastTemp.time}</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5">
                            ${dayTemps.map(t => { const lv = tempLevel(t.temp); return `<span class="text-xs font-bold ${lv.text} bg-white/80 border ${lv.border} px-2 py-1 rounded-lg flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full ${lv.dot}"></span>${t.time} · ${parseFloat(t.temp).toFixed(1)}°</span>`; }).join('')}
                        </div>
                    </div>` : ''}

                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <button onclick="Actions.openModal('regular')" class="py-3 bg-blue-600 text-white rounded-xl font-bold shadow-md active:scale-95 transition-all flex flex-col items-center justify-center gap-1 text-xs">${I.Plus} Agendar</button>
                        <button onclick="Actions.openModal('occasional')" class="py-3 bg-purple-100 text-purple-700 rounded-xl font-bold shadow-sm active:scale-95 transition-all flex flex-col items-center justify-center gap-1 text-xs">${I.Plus} Ocasional</button>
                        <button onclick="Actions.openModal('fever')" class="py-3 bg-red-100 text-red-600 rounded-xl font-bold shadow-sm active:scale-95 transition-all flex flex-col items-center justify-center gap-1 text-xs">${I.Thermometer} Fiebre</button>
                    </div>

                    <h3 class="font-bold text-gray-700 text-lg mb-3 px-1">Agenda</h3>
                    <div class="space-y-3">
                        ${flatList.length === 0 ? `<div class="text-center py-12 opacity-40"><div class="w-16 h-16 bg-gray-200 rounded-full mx-auto mb-3 flex items-center justify-center text-gray-400">${I.Pill}</div><p>Nada programado para ${formatDayLabel(selDate).toLowerCase()}</p></div>` : flatList.map(m => `
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3 transition-all ${m.isTaken ? 'opacity-60 bg-gray-50/50' : ''}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-4 flex-1 cursor-pointer" onclick="Actions.openModal('regular', ${m.id})">
                                        <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${m.isTaken ? 'bg-green-100 text-green-600' : `${p.light} ${p.text}`}">${I.Pill}</div>
                                        <div><p class="font-bold text-gray-800 text-lg leading-tight">${m.name}</p><p class="text-sm text-gray-500 mt-0.5 font-medium">${m.dose}</p></div>
                                    </div>
                                    <button onclick="Actions.toggleTaken(${m.id}, '${m.displayTime}')" class="w-12 h-12 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${m.isTaken ? 'bg-green-500 border-green-500 text-white shadow-md scale-105' : 'border-gray-200 text-gray-300 active:border-blue-300'}">${m.isTaken ? I.Check : ''}</button>
                                </div>
                                <div class="border-t border-gray-100 pt-2 mt-1 flex justify-between items-center">
                                    <div class="flex items-center gap-1 text-xs text-gray-500 font-bold bg-gray-50 px-2 py-1 rounded-lg">${I.Clock} ${m.displayTime}</div>
                                    <button onclick="Actions.addToCalendar(${m.id}, '${m.displayTime}')" class="text-xs font-bold text-blue-600 flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-blue-50 active:bg-blue-100 transition-colors">${I.Calendar} Alarma</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;

            } else if (store.view === 'history') {
                // Unificamos tomas (logs) y mediciones de temperatura en una sola línea de tiempo
                const logItems = store.logs.filter(l => l.profile_id === store.currentProfile).map(l => ({ kind: 'log', date: l.date, time: l.taken_at || l.time, data: l }));
                const tempItems = store.temps.filter(t => t.profile_id === store.currentProfile).map(t => ({ kind: 'temp', date: t.date, time: t.time, data: t }));
                const items = [...logItems, ...tempItems];
                const grouped = {}; items.forEach(it => { if (!grouped[it.date]) grouped[it.date] = []; grouped[it.date].push(it); });
                content = `<h2 class="font-bold text-xl text-gray-800 mb-4 px-1">Historial</h2>`;
                if (items.length === 0) content += `<div class="text-center py-12 opacity-40"><p>No hay registros</p></div>`;
                else {
                    content += `<div class="space-y-6">`;
                    Object.keys(grouped).sort().reverse().forEach(date => {
                        const dateStr = new Date(date + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                        const rows = grouped[date].sort((a, b) => (b.time || '').localeCompare(a.time || ''));
                        content += `<div><h3 class="text-xs font-bold uppercase text-gray-400 mb-3 ml-1 sticky top-0 bg-gray-50 py-2 backdrop-blur-sm bg-opacity-90">${date === today ? 'Hoy' : dateStr}</h3><div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">${rows.map((it, idx) => {
                            const border = idx !== rows.length - 1 ? 'border-b border-gray-50' : '';
                            if (it.kind === 'temp') {
                                const t = it.data; const lv = tempLevel(t.temp);
                                return `<div class="p-4 flex justify-between items-center ${border}">
                                    <div class="flex items-center gap-3">
                                        <div class="${lv.bg} ${lv.text} p-1.5 rounded-lg scale-90">${I.Thermometer}</div>
                                        <div><p class="font-bold text-gray-800">${parseFloat(t.temp).toFixed(1)}° <span class="text-xs font-bold ${lv.text}">${lv.label}</span></p><p class="text-xs text-gray-500">${t.note ? t.note : 'Temperatura'}</p></div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="text-right"><p class="font-bold text-gray-600 text-sm">${t.time}</p></div>
                                        <button onclick="Actions.deleteTemp(${t.id})" class="text-gray-300 hover:text-red-500 p-2">${I.Trash}</button>
                                    </div>
                                </div>`;
                            }
                            const log = it.data;
                            return `<div class="p-4 flex justify-between items-center ${border}">
                                <div class="flex items-center gap-3">
                                    <div class="${log.med_id ? 'bg-green-50 text-green-600' : 'bg-purple-50 text-purple-600'} p-1.5 rounded-lg scale-90">${log.med_id ? I.Check : I.Zap}</div>
                                    <div><p class="font-bold text-gray-800">${log.name}</p><p class="text-xs text-gray-500">${log.dose}</p></div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="text-right"><p class="font-bold text-gray-600 text-sm">${log.taken_at || log.time}</p><p class="text-[10px] text-gray-400">${log.med_id ? 'Prog: '+log.time : 'Ocasional'}</p></div>
                                    <button onclick="Actions.deleteLog(${log.id})" class="text-gray-300 hover:text-red-500 p-2">${I.Trash}</button>
                                </div>
                            </div>`;
                        }).join('')}</div></div>`;
                    });
                    content += `</div>`;
                }

            } else if (store.view === 'stock') {
                content = `<h2 class="font-bold text-xl text-gray-800 mb-4 px-1">Stock</h2><div class="grid grid-cols-2 gap-3">${meds.filter(m => m.track_stock).map(m => `
                    <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm relative flex flex-col justify-between h-40">
                        <div onclick="Actions.openModal('regular', ${m.id})" class="absolute top-0 right-0 p-3 text-gray-300 hover:text-blue-500 cursor-pointer active:scale-90 transition-transform">${I.Edit}</div>
                        <div class="mt-2"><h3 class="font-bold text-gray-800 truncate pr-6">${m.name}</h3><div class="mt-1 flex items-end gap-1"><span class="text-4xl font-bold ${parseInt(m.stock) <= parseInt(m.min_stock) ? 'text-red-500' : 'text-gray-700'}">${m.stock}</span><span class="text-xs text-gray-500 mb-1 font-medium">unid.</span></div></div>
                        <div class="flex gap-2 mt-2"><button onclick="Actions.updateStock(${m.id}, -1)" class="flex-1 bg-red-50 text-red-600 rounded-xl font-bold text-xl py-2 active:bg-red-100 transition-colors">-</button><button onclick="Actions.updateStock(${m.id}, 1)" class="flex-1 bg-green-50 text-green-600 rounded-xl font-bold text-xl py-2 active:bg-green-100 transition-colors">+</button></div>
                    </div>`).join('')}</div><button onclick="Actions.openModal('regular'); Actions.updateForm('trackStock', true)" class="w-full py-4 border-2 border-dashed border-gray-300 rounded-2xl text-gray-400 font-bold flex items-center justify-center gap-2 mt-6 active:bg-gray-100 transition-colors">${I.Plus} Añadir Stock</button>`;
            }

            document.getElementById('app-content').innerHTML = content;
            document.getElementById('nav-container').innerHTML = `<div class="max-w-md mx-auto flex justify-around items-center h-16"><button onclick="Actions.setView('home')" class="flex flex-col items-center gap-1 w-1/4 ${store.view === 'home' ? 'text-blue-600' : 'text-gray-400'}">${I.Home}<span class="text-[10px] font-bold">Hoy</span></button><button onclick="Actions.setView('history')" class="flex flex-col items-center gap-1 w-1/4 ${store.view === 'history' ? 'text-blue-600' : 'text-gray-400'}">${I.History}<span class="text-[10px] font-bold">Historial</span></button><div class="relative -top-6 w-1/4 flex justify-center"><button onclick="Actions.openModal('regular')" class="bg-blue-600 text-white w-14 h-14 rounded-full shadow-xl shadow-blue-200 flex items-center justify-center border-4 border-white transform active:scale-95 transition-transform">${I.Plus}</button></div><button onclick="Actions.setView('stock')" class="flex flex-col items-center gap-1 w-1/4 ${store.view === 'stock' ? 'text-blue-600' : 'text-gray-400'}">${I.Stock}<span class="text-[10px] font-bold">Stock</span></button></div>`;

            if (store.modal) {
                let modalContent = '';

                // Fila de chips de medicamentos frecuentes (reutilizada en Ocasional y Fiebre)
                const freqMeds = getFrequentMeds();
                const chipRow = (fn) => `<div class="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1">${freqMeds.map(s => { const n = s.name.replace(/'/g, "\\'"); const d = (s.dose || '').replace(/'/g, "\\'"); return `<button onclick="Actions.${fn}('${n}', '${d}')" class="shrink-0 text-xs font-bold bg-gray-100 text-gray-700 px-3 py-2 rounded-xl active:bg-gray-200 transition-colors">${s.name}${s.dose ? ` <span class="text-gray-400">${s.dose}</span>` : ''}</button>`; }).join('')}</div>`;

                if (store.modalType === 'regular') {
                    // FORMULARIO REGULAR MULTI-HORA
                    modalContent = `
                        <div class="space-y-5">
                            <div><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Nombre</label><input type="text" value="${store.form.name}" oninput="Actions.updateForm('name', this.value)" class="w-full p-4 bg-gray-50 rounded-xl font-bold text-lg border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Ej: Ibuprofeno"></div>
                            <div class="flex gap-4">
                                <div class="w-1/2"><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Dosis</label><input type="text" value="${store.form.dose}" oninput="Actions.updateForm('dose', this.value)" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500" placeholder="500mg"></div>
                                <div class="w-1/2">
                                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Horarios</label>
                                    <div class="space-y-2">
                                        ${store.form.times.map((t, i) => `
                                            <div class="flex gap-1">
                                                <input type="time" value="${t}" oninput="Actions.updateTimeSlot(${i}, this.value)" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500">
                                                ${i > 0 ? `<button onclick="Actions.removeTimeSlot(${i})" class="px-2 text-red-400 hover:text-red-600 font-bold">×</button>` : ''}
                                            </div>
                                        `).join('')}
                                        <button onclick="Actions.addTimeSlot()" class="text-xs text-blue-600 font-bold py-1">+ Agregar hora</button>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Frecuencia</label>
                                <select onchange="Actions.updateForm('frequencyType', this.value)" class="w-full p-3 bg-white border border-gray-200 rounded-xl mb-3">
                                    <option value="daily" ${store.form.frequencyType === 'daily' ? 'selected' : ''}>Todos los días</option>
                                    <option value="specific_days" ${store.form.frequencyType === 'specific_days' ? 'selected' : ''}>Días específicos</option>
                                    <option value="interval" ${store.form.frequencyType === 'interval' ? 'selected' : ''}>Intervalo</option>
                                </select>
                                ${store.form.frequencyType === 'specific_days' ? `<div class="flex justify-between gap-1 mb-2">${['L','M','M','J','V','S','D'].map((d, i) => { const val = (i + 1) % 7; const selected = store.form.frequencyDays.includes(val.toString()); return `<button onclick="Actions.toggleDay('${val}')" class="day-btn w-9 h-9 rounded-full text-xs font-bold border ${selected ? 'selected' : 'bg-white border-gray-200 text-gray-500'}">${d}</button>` }).join('')}</div>` : ''}
                                ${store.form.frequencyType === 'interval' ? `<div class="flex gap-3"><div class="flex-1"><label class="text-xs text-gray-500 mb-1 block">Cada (días)</label><input type="number" value="${store.form.intervalDays}" oninput="Actions.updateForm('intervalDays', this.value)" class="w-full p-3 bg-white border border-gray-200 rounded-xl"></div><div class="flex-1"><label class="text-xs text-gray-500 mb-1 block">Inicio</label><input type="date" value="${store.form.startDate}" oninput="Actions.updateForm('startDate', this.value)" class="w-full p-3 bg-white border border-gray-200 rounded-xl"></div></div>` : ''}
                            </div>
                            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                <label class="flex items-center gap-3 text-sm font-bold text-blue-800 mb-2 cursor-pointer select-none py-1"><input type="checkbox" ${store.form.trackStock ? 'checked' : ''} onchange="Actions.updateForm('trackStock', this.checked)" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500"> Controlar Stock</label>
                                ${store.form.trackStock ? `<div class="flex gap-3 animate-fade-in mt-3"><div class="flex-1"><label class="text-xs text-blue-600 font-semibold block mb-1">Cantidad</label><input type="number" value="${store.form.stock}" oninput="Actions.updateForm('stock', this.value)" class="w-full p-3 bg-white border border-blue-200 rounded-xl focus:outline-none focus:border-blue-500"></div><div class="flex-1"><label class="text-xs text-blue-600 font-semibold block mb-1">Avisar con</label><input type="number" value="${store.form.minStock}" oninput="Actions.updateForm('minStock', this.value)" class="w-full p-3 bg-white border border-blue-200 rounded-xl focus:outline-none focus:border-blue-500"></div></div>` : ''}
                            </div>
                            <button onclick="Actions.saveForm()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-lg shadow-blue-200 active:bg-blue-700 active:scale-[0.98] transition-all mt-2">Guardar</button>
                            ${store.editId ? `<button onclick="Actions.deleteMed()" class="w-full py-3 text-red-500 font-bold text-sm active:bg-red-50 rounded-xl transition-all flex items-center justify-center gap-2">${I.Trash} Eliminar Medicamento</button>` : ''}
                        </div>
                    `;
                } else if (store.modalType === 'occasional') {
                    modalContent = `
                        <div class="space-y-5">
                            <div class="bg-purple-50 p-3 rounded-xl text-purple-800 text-sm font-medium text-center mb-2">⚡ Registro Rápido (Ocasional)</div>
                            <div><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Sugerencias</label>${chipRow('applySuggestion')}</div>
                            <div><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Qué tomaste</label><input type="text" value="${store.form.name}" oninput="Actions.updateForm('name', this.value)" class="w-full p-4 bg-gray-50 rounded-xl font-bold text-lg border border-gray-200 outline-none focus:ring-2 focus:ring-purple-500 transition-all" placeholder="Ej: Paracetamol"></div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Dosis</label><input type="text" value="${store.form.dose}" oninput="Actions.updateForm('dose', this.value)" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-purple-500" placeholder="500mg"></div>
                                <div class="flex-1"><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Hora</label><input type="time" value="${store.form.time}" oninput="Actions.updateForm('time', this.value)" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-purple-500"></div>
                            </div>
                            <button onclick="Actions.saveOccasional()" class="w-full py-4 bg-purple-600 text-white rounded-xl font-bold text-lg shadow-lg shadow-purple-200 active:bg-purple-700 active:scale-[0.98] transition-all mt-4">Registrar Toma</button>
                        </div>
                    `;
                } else {
                    // MODAL DE FIEBRE
                    const commonTemps = ['37', '37.5', '38', '38.5', '39', '39.5'];
                    const curTemp = store.form.temp || '';
                    modalContent = `
                        <div class="space-y-5">
                            <div class="bg-red-50 p-3 rounded-xl text-red-700 text-sm font-medium text-center mb-2 flex items-center justify-center gap-2">${I.Thermometer} Registro de Temperatura</div>
                            <div>
                                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Temperatura (°C)</label>
                                <input type="number" inputmode="decimal" step="0.1" value="${curTemp}" oninput="Actions.updateForm('temp', this.value)" class="w-full p-4 bg-gray-50 rounded-xl font-bold text-2xl text-center border border-gray-200 outline-none focus:ring-2 focus:ring-red-500 transition-all" placeholder="38.0">
                                <div class="flex gap-2 mt-2 overflow-x-auto no-scrollbar -mx-1 px-1">
                                    ${commonTemps.map(t => `<button onclick="Actions.updateForm('temp', '${t}'); render()" class="shrink-0 text-sm font-bold px-3 py-1.5 rounded-lg transition-colors ${curTemp === t ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-600 active:bg-gray-200'}">${t}°</button>`).join('')}
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Hora</label><input type="time" value="${store.form.time}" oninput="Actions.updateForm('time', this.value)" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-red-500"></div>
                                <div class="flex-1"><label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Nota</label><input type="text" value="${store.form.note || ''}" oninput="Actions.updateForm('note', this.value)" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-red-500" placeholder="Opcional"></div>
                            </div>
                            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                <label class="text-xs font-bold text-blue-700 uppercase tracking-wider mb-2 block">¿Le diste algo? (opcional)</label>
                                ${chipRow('applyFeverMed')}
                                <div class="flex gap-3 mt-3">
                                    <div class="flex-1"><input type="text" value="${store.form.medName || ''}" oninput="Actions.updateForm('medName', this.value)" class="w-full p-3 bg-white border border-blue-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Medicamento"></div>
                                    <div class="w-28"><input type="text" value="${store.form.medDose || ''}" oninput="Actions.updateForm('medDose', this.value)" class="w-full p-3 bg-white border border-blue-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Dosis"></div>
                                </div>
                            </div>
                            <button onclick="Actions.saveTemperature()" class="w-full py-4 bg-red-600 text-white rounded-xl font-bold text-lg shadow-lg shadow-red-200 active:bg-red-700 active:scale-[0.98] transition-all mt-2">Registrar Temperatura</button>
                        </div>
                    `;
                }

                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
                        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl animate-slide-up max-h-[85vh] overflow-y-auto">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-bold text-xl text-gray-800">${store.modalType === 'regular' ? (store.editId ? 'Editar' : 'Nuevo') : (store.modalType === 'fever' ? 'Fiebre' : 'Ocasional')}</h3><button onclick="Actions.closeModal()" class="bg-gray-100 p-2 rounded-full active:bg-gray-200 text-gray-600">${I.X}</button></div>
                            ${modalContent}
                        </div>
                    </div>`;
            } else { document.getElementById('modal-container').innerHTML = ''; }
        }
        window.Actions = Actions;
        window.onload = init;
    </script>
</body>
</html>
